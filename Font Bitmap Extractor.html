<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字库点阵提取</title>
<style>
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58a6ff;
    --comment: #8b949e;
    --raised: #161b22;
    --border: #21262d;
    --danger: #f85149;
    --success: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .container {
    display: grid;
    grid-template-columns: 280px 280px 1fr;
    gap: 16px;
  }
  .preview-area { align-self: start; }
  /* ---- 控制面板 ---- */
  .panel {
    background: var(--raised);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .panel h2 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .control-group {
    margin-bottom: 16px;
  }
  .control-group label {
    display: block;
    font-size: 13px;
    color: var(--comment);
    margin-bottom: 4px;
  }
  .control-group .value-display {
    float: right;
    color: var(--accent);
    font-weight: bold;
    font-size: 13px;
  }
  .control-group input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .control-group input[type="number"],
  .control-group select,
  .control-group input[type="text"] {
    width: 100%;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .control-group input[type="number"]:focus,
  .control-group select:focus {
    border-color: var(--accent);
  }
  .control-group textarea {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    min-height: 60px;
  }
  .control-group textarea:focus {
    border-color: var(--accent);
  }
  .control-row {
    display: flex;
    gap: 8px;
  }
  .control-row .control-group {
    flex: 1;
  }
  .btn {
    padding: 4px 16px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    line-height: 1.4;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:hover {
    background: color-mix(in srgb, var(--accent) 80%, white);
  }
  .btn-success {
    background: var(--success);
    color: var(--bg);
  }
  .btn-success:hover {
    background: color-mix(in srgb, var(--success) 80%, white);
  }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .btn-danger:hover {
    background: color-mix(in srgb, var(--danger) 80%, white);
  }
  .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-group .btn { border: 1px solid var(--border); }
  .file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
  }
  .file-input-wrapper input[type="file"] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #fontName {
    font-size: 12px;
    color: var(--comment);
    margin-top: 4px;
    word-break: break-all;
  }

  /* ---- 右侧预览区 ---- */
  .preview-area {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-self: start;
  }
  .preview-card {
    background: var(--raised);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .preview-card h2 {
    font-size: 14px;
    margin-bottom: 12px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    font-weight: 600;
  }
  .canvas-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100px;
    background: var(--bg);
    border-radius: 8px;
    padding: 16px;
    overflow: auto;
    position: relative;
  }
  .canvas-wrapper canvas {
    image-rendering: pixelated;
    display: block;
  }
  .info-bar {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: var(--comment);
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .info-bar span {
    background: var(--border);
    padding: 2px 10px;
    border-radius: 4px;
  }
  .info-bar em {
    color: var(--accent);
    font-style: normal;
    font-weight: bold;
  }

  /* ---- 导出区 ---- */
  .export-card {
    background: var(--raised);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .export-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .export-header h2 {
    font-size: 14px;
    color: var(--accent);
    border: none;
    padding: 0;
    margin: 0;
    font-weight: 600;
  }
  #exportOutput {
    width: 100%;
    min-height: 180px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--comment);
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    resize: vertical;
    outline: none;
  }

  /* ---- 滚动条美化 ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--comment); }

  /* ---- 本地字库列表 ---- */
  .font-list {
    flex: 1;
    min-height: 80px;
    max-height: 180px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
  }
  .font-list .font-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
    transition: all 0.15s;
  }
  .font-list .font-item:hover {
    background: var(--border);
  }
  .font-list .font-item.active {
    background: var(--border);
    border-left: 3px solid var(--accent);
  }
  .font-list .font-item .font-family {
    color: var(--text);
    font-weight: 500;
  }
  .font-list .font-item .font-style {
    color: var(--accent);
    font-size: 11px;
  }
  .font-list .font-loading {
    color: var(--accent);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }
  .font-list .font-error {
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }

  .size-shortcuts {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  #fontShortcuts .btn-shortcut {
    flex: 0 0 calc(14.285% - 4px);
    min-width: 0;
    font-size: 14px;
    font-weight: bold;
  }
  .btn-shortcut {
    flex: 1 0 calc(25% - 4px);
    min-width: 32px;
    padding: 4px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .btn-shortcut:hover {
    background: var(--border);
    border-color: var(--accent);
  }
  .padding-display {
    display:inline-block;
    width:52px;
    padding:3px 2px;
    font-size:12px;
    font-weight:bold;
    color:var(--accent);
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .padding-input {
    width: 100%;
    padding: 6px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  .padding-input::-webkit-outer-spin-button,
  .padding-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .stepper-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .stepper-pair {
    flex: 1;
    display: flex;
    gap: 3px;
  }
  .stepper-btn {
    flex: 1;
    padding: 4px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
    text-align: center;
  }
  .stepper-btn:hover {
    background: var(--border);
  }
  .stepper-btn:active {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-shortcut.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ---- 方向键(DPAD) ---- */
  .dpad {
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .dpad-row {
    display:flex; align-items:center; gap:2px;
  }
  .dpad .stepper-btn {
    width:32px; height:32px; font-size:16px; padding:0;
  }
  .dpad-center {
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    color:var(--comment); font-size:18px; font-weight:bold;
  }
  .dpad-row div:first-child, .dpad-row div:last-child { width:36px; }

  /* ---- 模态弹窗 ---- */
  .modal-overlay {
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,0.6); align-items:center; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:var(--raised); border:1px solid var(--border); border-radius:6px;
    padding:20px; max-width:560px; width:90%;
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  .modal-title {
    font-size:14px; font-weight:600; color:var(--text); margin-bottom:12px;
  }
  .modal-body {
    font-size:13px; color:var(--comment); margin-bottom:16px; line-height:1.6;
  }
  .modal-footer {
    display:flex; gap:8px; justify-content:center;
  }
  /* ---- 主题选择器 ---- */
  .theme-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .theme-option {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 12px; border:2px solid var(--border); border-radius:8px;
    cursor:pointer; transition:all .2s; background:var(--raised);
    flex:1 0 calc(33.33% - 8px); min-width:100px;
  }
  .theme-option:hover { border-color:var(--accent); }
  .theme-option.theme-selected { border-color:var(--accent); box-shadow:0 0 8px var(--accent); }
  .theme-swatches { display:flex; gap:2px; }
  .theme-swatches span { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid var(--border); }
  .btn-icon {
    background:transparent; border:1px solid var(--border);
    border-radius:6px; cursor:pointer; font-size:16px;
    padding:4px 8px; line-height:1; transition:all .2s;
  }
  .btn-icon:hover { border-color:var(--accent); background:var(--raised); }

  @media (max-width: 1100px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
  <h1 style="margin:0;font-size:18px;font-weight:600" data-i18n="appTitle">本地字库点阵提取工具</h1>
  <button class="btn-icon" id="themeBtn" data-i18n-title="switchTheme" title="切换主题">🎨</button>
  <button class="btn-icon" id="langBtn" data-i18n-title="switchLang" title="切换语言">🌐</button>
</div>

<!-- 模态弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-title" id="modalTitle">选择主题配色</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="container">

  <!-- ===== 中间参数面板（第2行，列1） ===== -->
  <div class="panel settings-panel">
    <h2 data-i18n="settings">[参数设置]</h2>

    <!-- 字体选择 -->
    <div class="control-group">
      <label data-i18n="fontFile">字体文件</label>
      <div class="btn-group">
        <div class="file-input-wrapper">
          <button class="btn btn-primary" data-i18n="selectFont">选择字体文件</button>
          <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2,.ttc">
        </div>
      </div>
      <div id="fontName">已加载: 系统默认字体</div>
    </div>

    <!-- 本地字库列表 -->
    <div class="control-group" id="localFontsGroup" style="display:none;flex:1;flex-direction:column;min-height:0;margin-bottom:0">
      <label data-i18n="localFonts">本地字库列表 <span id="fontCount" style="color:var(--accent);font-size:12px"></span></label>
      <div id="fontShortcuts" class="size-shortcuts" style="margin-bottom:4px"></div>
      <div id="localFontList" class="font-list"></div>
    </div>

    <div style="font-size:11px;color:#ff4444;margin:8px 0 12px 0;padding-bottom:4px;border-bottom:1px solid var(--border)" data-i18n="editWarning">↓ 改变后会清空手动编辑过的点阵</div>

    <!-- 输入文本 -->
    <div class="control-group">
      <label data-i18n="inputText">输入文本</label>
      <textarea id="inputText" data-i18n-placeholder="inputTextPlaceholder" placeholder="输入要提取点阵的文本...">Hello Wold！</textarea>
    </div>

    <!-- 字体大小 -->
    <div class="control-group">
      <label id="fontSizeLabel">字体大小 <span class="value-display" id="fontSizeDisplay">16</span></label>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="stepper-btn" data-target="fontSize" data-step="-1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">−</button>
        <input type="range" id="fontSize" min="6" max="200" value="16" step="1" style="flex:1">
        <button class="stepper-btn" data-target="fontSize" data-step="1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">+</button>
      </div>
      <div class="size-shortcuts">
        <button class="btn btn-shortcut" data-size="8">8</button>
        <button class="btn btn-shortcut active" data-size="16">16</button>
        <button class="btn btn-shortcut" data-size="24">24</button>
        <button class="btn btn-shortcut" data-size="32">32</button>
        <button class="btn btn-shortcut" data-size="40">40</button>
        <button class="btn btn-shortcut" data-size="48">48</button>
        <button class="btn btn-shortcut" data-size="56">56</button>
        <button class="btn btn-shortcut" data-size="64">64</button>
        <button class="btn btn-shortcut" data-size="72">72</button>
        <button class="btn btn-shortcut" data-size="80">80</button>
        <button class="btn btn-shortcut" data-size="88">88</button>
        <button class="btn btn-shortcut" data-size="96">96</button>
      </div>
    </div>

    <!-- 阈值 -->
    <div class="control-group">
      <label id="thresholdLabel">二值化阈值 <span class="value-display" id="thresholdInput">180</span></label>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="stepper-btn" data-target="threshold" data-step="-1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">−</button>
        <input type="range" id="threshold" min="1" max="255" value="180" step="1" style="flex:1">
        <button class="stepper-btn" data-target="threshold" data-step="1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">+</button>
      </div>
    </div>
  </div>

  <!-- ===== 布局调整卡片（第2行，列2） ===== -->
  <div class="panel layout-panel">
    <h2 data-i18n="layout">[布局调整]</h2>

    <div style="font-size:11px;color:#ff4444;margin:8px 0 12px 0;padding-bottom:4px;border-bottom:1px solid var(--border)" data-i18n="layoutHint">↓不会影响编辑过的点阵</div>

    <!-- 点阵单元大小 -->
    <div class="control-group">
      <label id="cellSizeLabel">点阵单元大小 <span class="value-display" id="cellSizeDisplay">4</span></label>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="stepper-btn" data-target="cellSize" data-step="-1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">−</button>
        <input type="range" id="cellSize" min="2" max="32" value="4" step="1" style="flex:1">
        <button class="stepper-btn" data-target="cellSize" data-step="1" style="width:28px;height:28px;font-size:16px;padding:0;flex:none">+</button>
      </div>
      <div class="size-shortcuts">
        <button class="btn btn-shortcut active" data-cell="4">4</button>
        <button class="btn btn-shortcut" data-cell="8">8</button>
        <button class="btn btn-shortcut" data-cell="12">12</button>
        <button class="btn btn-shortcut" data-cell="16">16</button>
        <button class="btn btn-shortcut" data-cell="20">20</button>
        <button class="btn btn-shortcut" data-cell="24">24</button>
        <button class="btn btn-shortcut" data-cell="28">28</button>
        <button class="btn btn-shortcut" data-cell="32">32</button>
      </div>
    </div>

    <!-- 上下左右边距 -->
    <div class="control-group">
      <label data-i18n="padding">边距</label>
      <div style="display:grid;grid-template-columns:1fr 36px 1fr;grid-template-rows:1fr 36px 1fr;gap:4px;align-items:center;justify-items:center">
        <div style="grid-row:1;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:2px">
          <span style="font-size:10px;color:var(--comment)" data-i18n="top">上</span>
          <span id="paddingTop" class="padding-display">0</span>
          <div style="display:flex;gap:2px">
            <button class="stepper-btn" data-target="paddingTop" data-step="-1" style="width:24px;height:22px;font-size:12px;padding:0">−</button>
            <button class="stepper-btn" data-target="paddingTop" data-step="1" style="width:24px;height:22px;font-size:12px;padding:0">+</button>
          </div>
        </div>
        <div style="grid-row:2;grid-column:1;display:flex;flex-direction:column;align-items:center;gap:2px">
          <span style="font-size:10px;color:var(--comment)" data-i18n="left">左</span>
          <span id="paddingLeft" class="padding-display">0</span>
          <div style="display:flex;gap:2px">
            <button class="stepper-btn" data-target="paddingLeft" data-step="-1" style="width:24px;height:22px;font-size:12px;padding:0">−</button>
            <button class="stepper-btn" data-target="paddingLeft" data-step="1" style="width:24px;height:22px;font-size:12px;padding:0">+</button>
          </div>
        </div>
        <div style="grid-row:2;grid-column:2;color:var(--comment);font-size:14px;opacity:0.3">+</div>
        <div style="grid-row:2;grid-column:3;display:flex;flex-direction:column;align-items:center;gap:2px">
          <span style="font-size:10px;color:var(--comment)" data-i18n="right">右</span>
          <span id="paddingRight" class="padding-display">0</span>
          <div style="display:flex;gap:2px">
            <button class="stepper-btn" data-target="paddingRight" data-step="-1" style="width:24px;height:22px;font-size:12px;padding:0">−</button>
            <button class="stepper-btn" data-target="paddingRight" data-step="1" style="width:24px;height:22px;font-size:12px;padding:0">+</button>
          </div>
        </div>
        <div style="grid-row:3;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:2px">
          <span style="font-size:10px;color:var(--comment)" data-i18n="bottom">下</span>
          <span id="paddingBottom" class="padding-display">0</span>
          <div style="display:flex;gap:2px">
            <button class="stepper-btn" data-target="paddingBottom" data-step="-1" style="width:24px;height:22px;font-size:12px;padding:0">−</button>
            <button class="stepper-btn" data-target="paddingBottom" data-step="1" style="width:24px;height:22px;font-size:12px;padding:0">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 阴阳码 + 数组维度 + 语言 -->

            <option value="1d" data-i18n="dim1d">字节压缩</option>

          <select id="langSelect" style="width:100%;padding:3px 6px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;outline:none">
            <option value="c">C/C++</option>
            <option value="arduino">Arduino</option>
            <option value="python">Python</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>

    <!-- 操作按钮 -->

      <button class="btn btn-primary" id="copyBtn" style="flex:1" data-i18n="copyExport">复制导出</button>
      <button class="btn btn-primary" id="saveBtn" style="flex:1" data-i18n="saveFile">保存为文件</button>
    </div>
  </div>

  <!-- ===== 右侧预览区（第4列） ===== -->
  <div class="preview-area">
    <!-- 点阵效果图 -->
    <div class="preview-card">
      <h2 data-i18n="bitmapPreview">点阵效果图(可手动编辑)</h2>
      <div class="canvas-wrapper" id="bitmapPreviewWrapper">
        <canvas id="bitmapCanvas"></canvas>
      </div>
      <div class="info-bar">
        <span><em id="bitmapDims">0 × 0</em></span>
      </div>
    </div>

    <!-- 原始渲染对比 -->
    <div class="preview-card">
      <h2 data-i18n="rawRender">原始渲染 (灰度采样参考)</h2>
      <div class="canvas-wrapper" id="rawPreviewWrapper">
        <canvas id="rawCanvas"></canvas>
      </div>

    <!-- 导出区 -->
    <div class="export-card">
      <div class="export-header">
        <h2 data-i18n="exportData">导出数据</h2>

      </div>
      <textarea id="exportOutput" readonly data-i18n-placeholder="exportPlaceholder" placeholder="点击「刷新导出」或调整参数后自动生成..."></textarea>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // ---- DOM 引用 ----
  const fontFileInput    = document.getElementById('fontFileInput');
  const fontName         = document.getElementById('fontName');
  const inputText        = document.getElementById('inputText');
  const fontSizeSlider   = document.getElementById('fontSize');
  const fontSizeDisplay  = document.getElementById('fontSizeDisplay');
  const cellSizeSlider   = document.getElementById('cellSize');
  const cellSizeDisplay  = document.getElementById('cellSizeDisplay');
  const thresholdSlider  = document.getElementById('threshold');
  const thresholdInput   = document.getElementById('thresholdInput');
  const paddingTop       = document.getElementById('paddingTop');
  const paddingBottom    = document.getElementById('paddingBottom');
  const paddingLeft      = document.getElementById('paddingLeft');
  const paddingRight     = document.getElementById('paddingRight');
  const offsetX          = document.getElementById('offsetX');
  const offsetY          = document.getElementById('offsetY');
  const offsetDisplay    = document.getElementById('offsetDisplay');
  function updateOffsetDisplay() { offsetDisplay.textContent = 'X:' + offsetX.value + ' Y:' + offsetY.value; }
  updateOffsetDisplay();
  const yinYangSelect    = document.getElementById('yinYangSelect');
  const arrayDimSelect   = document.getElementById('arrayDimSelect');
  const langSelect       = document.getElementById('langSelect');
  const copyBtn          = document.getElementById('copyBtn');
  const saveBtn          = document.getElementById('saveBtn');

  const bitmapCanvas      = document.getElementById('bitmapCanvas');
  const bitmapCtx         = bitmapCanvas.getContext('2d');
  const rawCanvas         = document.getElementById('rawCanvas');
  const rawCtx            = rawCanvas.getContext('2d');

  const bitmapDims        = document.getElementById('bitmapDims');
  const exportOutput      = document.getElementById('exportOutput');

  // ---- 本地字库 DOM ----
  const localFontsGroup   = document.getElementById('localFontsGroup');
  const localFontList     = document.getElementById('localFontList');
  const fontCount         = document.getElementById('fontCount');
  const fontShortcuts     = document.getElementById('fontShortcuts');

  // ---- 状态 ----
  let loadedFontFamily = null;   // 自定义字体 family 名
  let loadedFontUrl    = null;   // 自定义字体 URL (blob:)
  let loadedFontName   = '';
  let pendingRender    = null;
  let allFontsData     = [];     // 缓存本地字体列表

  // ---- 工具: 防抖 ----
  function debounce(fn, ms) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), ms);
    };
  }

  // ---- 节流 (动画帧) ----
  function throttled(fn) {
    let ticking = false;
    return (...args) => {
      if (!ticking) {
        requestAnimationFrame(() => { ticking = false; fn(...args); });
        ticking = true;
      }
    };
  }

  // ---- 核心函数: 获取像素矩阵 (自动裁剪空白) ----
  function getBitmapMatrix(text, fontSize, thresholdVal) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    const fontStr = `${fontSize}px "${loadedFontFamily || 'sans-serif'}"`;
    measureCtx.font = fontStr;
    const metrics = measureCtx.measureText(text);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.4;

    // 先用大画布渲染（预留足够空间给偏移和边距）
    const padExtra = 20;
    const canvasW = Math.max(1, Math.ceil(textWidth) + padExtra * 2);
    const canvasH = Math.max(1, Math.ceil(textHeight) + padExtra * 2);

    tempCanvas.width = canvasW;
    tempCanvas.height = canvasH;

    tempCtx.fillStyle = '#ffffff';
    tempCtx.fillRect(0, 0, canvasW, canvasH);

    // 在中间绘制文字
    tempCtx.font = fontStr;
    tempCtx.textBaseline = 'top';
    tempCtx.fillStyle = '#000000';
    tempCtx.fillText(text, padExtra, padExtra);

    // 采样像素，找到文字的实际边界框
    const imageData = tempCtx.getImageData(0, 0, canvasW, canvasH);
    const data = imageData.data;
    const initialMatrix = [];

    for (let row = 0; row < canvasH; row++) {
      const rowData = [];
      for (let col = 0; col < canvasW; col++) {
        const idx = (row * canvasW + col) * 4;
        const luminance = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
        rowData.push(luminance < thresholdVal ? 1 : 0);
      }
      initialMatrix.push(rowData);
    }

    // 自动裁剪：找到前景像素的最小包围盒
    let minRow = canvasH, maxRow = 0, minCol = canvasW, maxCol = 0;
    let fg = 0;
    for (let row = 0; row < canvasH; row++) {
      for (let col = 0; col < canvasW; col++) {
        if (initialMatrix[row][col] === 1) {
          fg++;
          if (row < minRow) minRow = row;
          if (row > maxRow) maxRow = row;
          if (col < minCol) minCol = col;
          if (col > maxCol) maxCol = col;
        }
      }
    }

    // 无前景点 → 返回 1×1 空矩阵
    if (fg === 0) {
      const emptyCrop = [[0]];
      const emptyCanvas = document.createElement('canvas');
      emptyCanvas.width = 1; emptyCanvas.height = 1;
      return { matrix: [[0]], rawMatrix: [[0]], cropMatrix: emptyCrop, cropW: 1, cropH: 1, width: 1, height: 1, fg: 0, bg: 1, tempCanvas: emptyCanvas };
    }

    // 裁剪后的基本尺寸
    let cropW = maxCol - minCol + 1;
    let cropH = maxRow - minRow + 1;

    // 应用用户设置的边距
    const pt = parseInt(paddingTop.textContent) || 0;
    const pb = parseInt(paddingBottom.textContent) || 0;
    const pl = parseInt(paddingLeft.textContent) || 0;
    const pr = parseInt(paddingRight.textContent) || 0;

    // 应用偏移
    const ox = parseInt(offsetX.value) || 0;
    const oy = parseInt(offsetY.value) || 0;

    const finalW = Math.max(1, cropW + pl + pr);
    const finalH = Math.max(1, cropH + pt + pb);

    // 构建最终矩阵：裁剪 + 边距 + 偏移
    const matrix = [];
    for (let row = 0; row < finalH; row++) {
      const rowData = [];
      for (let col = 0; col < finalW; col++) {
        // 映射到原始裁剪区域的坐标（含偏移）
        const srcRow = row - pt + oy;
        const srcCol = col - pl + ox;
        if (srcRow >= 0 && srcRow < cropH && srcCol >= 0 && srcCol < cropW) {
          rowData.push(initialMatrix[minRow + srcRow][minCol + srcCol]);
        } else {
          rowData.push(0);
        }
      }
      matrix.push(rowData);
    }

    const totalPixels = finalW * finalH;
    const fgCount = matrix.reduce((sum, r) => sum + r.reduce((s, v) => s + v, 0), 0);
    const bgCount = totalPixels - fgCount;

    // 阴阳码转换
    const isYin = document.getElementById('yinYangSelect')?.value === 'yin';
    const displayMatrix = isYin
      ? matrix.map(r => r.map(v => v === 1 ? 0 : 1))
      : matrix.map(r => [...r]);
    const displayFg = isYin ? bgCount : fgCount;
    const displayBg = isYin ? fgCount : bgCount;

    // 生成最终的原始渲染图（裁剪后+边距）
    const resultCanvas = document.createElement('canvas');
    resultCanvas.width = finalW;
    resultCanvas.height = finalH;
    const rCtx = resultCanvas.getContext('2d');
    rCtx.fillStyle = isYin ? '#000000' : '#ffffff';
    rCtx.fillRect(0, 0, finalW, finalH);
    const dotColor = isYin ? '#ffffff' : '#000000';
    for (let row = 0; row < finalH; row++) {
      for (let col = 0; col < finalW; col++) {
        if (displayMatrix[row][col] === 1) {
          rCtx.fillStyle = dotColor;
          rCtx.fillRect(col, row, 1, 1);
        }
      }
    }

    // 裁剪后的原始矩阵（无空白，无边距）
    const cropMatrix = [];
    for (let r = 0; r < cropH; r++) {
      const rowData = [];
      for (let c = 0; c < cropW; c++) {
        rowData.push(initialMatrix[minRow + r][minCol + c]);
      }
      cropMatrix.push(rowData);
    }

    return {
      matrix: displayMatrix,
      rawMatrix: matrix,
      cropMatrix: cropMatrix,
      cropW: cropW, cropH: cropH,
      width: finalW, height: finalH,
      fg: displayFg, bg: displayBg,
      tempCanvas: resultCanvas
    };
  }

  // ---- 获取当前主题色 ----
  function themeColor(v) {
    return getComputedStyle(document.documentElement).getPropertyValue('--' + v).trim();
  }
  function themeRgba(v, a) {
    const hex = themeColor(v);
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ---- 渲染点阵图 (单字) ----
  function renderSingleBitmap(ctx, matrix, cellSize, offsetX, offsetY, label) {
    const h = matrix.length;
    if (h === 0) return 0;
    const w = matrix[0].length;

    const isYin = (document.getElementById('yinYangSelect')?.value === 'yin');

    // 绘制每个点
    for (let row = 0; row < h; row++) {
      for (let col = 0; col < w; col++) {
        const x = offsetX + col * cellSize;
        const y = offsetY + row * cellSize;
        const isFg = matrix[row][col] === 1;
        const accent = themeColor('accent');
        const raised = themeColor('raised');
        const border = themeColor('border');
        if (isFg) {
          // 前景色
          ctx.fillStyle = isYin ? raised : accent;
          ctx.fillRect(x, y, cellSize, cellSize);
          ctx.strokeStyle = isYin ? accent : border;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, cellSize, cellSize);
          if (!isYin) {
            ctx.fillStyle = themeRgba('accent', 0.2);
            ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
          }
        } else {
          // 背景色
          ctx.fillStyle = isYin ? accent : raised;
          ctx.fillRect(x, y, cellSize, cellSize);
          ctx.strokeStyle = isYin ? border : accent;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, cellSize, cellSize);
          if (isYin) {
            ctx.fillStyle = themeRgba('accent', 0.2);
            ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
          }
        }
      }
    }
    // 在底部标注字符序号
    ctx.fillStyle = themeColor('accent');
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, offsetX + (w * cellSize) / 2, offsetY + h * cellSize + 14);
    return w * cellSize + 4; // 返回宽度 + 间距
  }

  // ---- 渲染原始采样图 (单字) ----
  function renderRawSingle(ctx, charResult, offsetX, offsetY, maxH) {
    const tempCanvas = charResult.tempCanvas;
    ctx.drawImage(tempCanvas, offsetX, offsetY + (maxH - tempCanvas.height) / 2);
  }

  // ---- 将矩阵居中填充到目标尺寸 ----
  function padMatrixToSize(matrix, targetW, targetH) {
    const h = matrix.length;
    if (h === 0) return matrix;
    const w = matrix[0].length;
    if (w === targetW && h === targetH) return matrix;

    const offsetX = Math.floor((targetW - w) / 2);
    const offsetY = Math.floor((targetH - h) / 2);

    const result = [];
    for (let row = 0; row < targetH; row++) {
      const rowData = [];
      for (let col = 0; col < targetW; col++) {
        const srcRow = row - offsetY;
        const srcCol = col - offsetX;
        if (srcRow >= 0 && srcRow < h && srcCol >= 0 && srcCol < w) {
          rowData.push(matrix[srcRow][srcCol]);
        } else {
          rowData.push(0);
        }
      }
      result.push(rowData);
    }
    return result;
  }

  // ---- 保存原始裁剪矩阵 + 手动编辑差异 ----
  let _rawChars = null;          // [{ char, matrix (裁剪后), width, height }] 不含边距/偏移
  let _editDeltas = [];          // [{ charIdx, row, col }] 手动点击的位置
  window._editKey = '';          // 标识文本/字体/阈值参数

  // ---- 将边距/偏移应用到裁剪后的矩阵 ----
  function applyPadding(rawMatrix, origW, origH) {
    const pt = parseInt(paddingTop.textContent) || 0;
    const pb = parseInt(paddingBottom.textContent) || 0;
    const pl = parseInt(paddingLeft.textContent) || 0;
    const pr = parseInt(paddingRight.textContent) || 0;
    const ox = parseInt(offsetX.value) || 0;
    const oy = parseInt(offsetY.value) || 0;
    const finalW = Math.max(1, origW + pl + pr);
    const finalH = Math.max(1, origH + pt + pb);
    const matrix = [];
    for (let row = 0; row < finalH; row++) {
      const rowData = [];
      for (let col = 0; col < finalW; col++) {
        const srcRow = row - pt + oy;
        const srcCol = col - pl + ox;
        if (srcRow >= 0 && srcRow < origH && srcCol >= 0 && srcCol < origW) {
          rowData.push(rawMatrix[srcRow][srcCol]);
        } else {
          rowData.push(0);
        }
      }
      matrix.push(rowData);
    }
    return matrix;
  }

  // ---- 完整渲染流程 ----
  function fullRender() {
    const text = inputText.value || ' ';
    const fontSize = parseFloat(fontSizeSlider.value);
    const thresholdVal = parseInt(thresholdSlider.value);
    const cellSize = parseInt(cellSizeSlider.value);
    const newKey = text + '|' + fontSize + '|' + thresholdVal + '|' + (loadedFontFamily || '');

    // 如果文本/字体/阈值未变，使用缓存的原始矩阵 + 边距 + 手动编辑
    if (_rawChars && window._editKey === newKey) {
      const chars = _rawChars.map(c => {
        const matrix = applyPadding(c.matrix, c.width, c.height);
        const h = matrix.length, w = matrix[0].length;
        return { ...c, matrix, width: w, height: h };
      });
      // 重新应用手动编辑（原始坐标 → 边距偏移跟随）
      const pt2 = parseInt(paddingTop.textContent) || 0;
      const pl2 = parseInt(paddingLeft.textContent) || 0;
      const ox2 = parseInt(offsetX.value) || 0;
      const oy2 = parseInt(offsetY.value) || 0;
      for (const d of _editDeltas) {
        const pr = d.row + pt2 - oy2;
        const pc = d.col + pl2 - ox2;
        if (d.charIdx < chars.length && pr >= 0 && pr < chars[d.charIdx].matrix.length && pc >= 0 && pc < chars[d.charIdx].matrix[0].length) {
          chars[d.charIdx].matrix[pr][pc] = d.val !== undefined ? d.val : 1;
        }
      }
      // 生成 tempCanvas
      for (const c of chars) {
        const cv = document.createElement('canvas');
        cv.width = c.width; cv.height = c.height;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        for (let r = 0; r < c.height; r++)
          for (let col = 0; col < c.width; col++)
            if (c.matrix[r][col]) { ctx.fillStyle = '#000'; ctx.fillRect(col, r, 1, 1); }
        c.tempCanvas = cv;
      }
      renderBitmapPreview(chars, cellSize);
      renderRawPreview(chars);
      return;
    }

    // 文本/字体/阈值变了 → 重新计算原始（无边距）矩阵
    window._editKey = newKey;
    _rawChars = null;
    _editDeltas = [];
    const rawChars = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '\n' || ch === '\r') continue;
      const result = getBitmapMatrix(ch, fontSize, thresholdVal);
      rawChars.push({ char: ch, ...result });
    }

    if (rawChars.length === 0) {
      const result = getBitmapMatrix(' ', fontSize, thresholdVal);
      rawChars.push({ char: ' ', ...result });
    }

    // 找到最大宽高作为统一尺寸（对裁剪后矩阵）
    let uniW = 0, uniH = 0;
    for (const c of rawChars) {
      if (c.cropW > uniW) uniW = c.cropW;
      if (c.cropH > uniH) uniH = c.cropH;
    }

    // 将所有字符的裁剪后矩阵填充到统一尺寸，保存为原始数据
    _rawChars = rawChars.map(c => {
      const padMatrix = padMatrixToSize(c.cropMatrix, uniW, uniH);
      return { char: c.char, matrix: padMatrix, width: uniW, height: uniH };
    });

    // 从原始数据 + 边距/偏移构建显示矩阵
    const chars = _rawChars.map(c => {
      const m = applyPadding(c.matrix, c.width, c.height);
      const h = m.length, w = m[0].length;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      for (let r = 0; r < h; r++)
        for (let col = 0; col < w; col++)
          if (m[r][col]) { ctx.fillStyle = '#000'; ctx.fillRect(col, r, 1, 1); }
      return { ...c, matrix: m, width: w, height: h, tempCanvas: cv };
    });

    // ---- 渲染点阵预览 ----
    renderBitmapPreview(chars, cellSize);

    renderRawPreview(chars);
  }

  // ---- 渲染原始采样参考 ----
  function renderRawPreview(chars) {
    if (!chars || chars.length === 0) return;
    const uniW = chars[0].width, uniH = chars[0].height;
    const rawGap = 8;
    const rawPerRow = 10;
    const rawRows = Math.ceil(chars.length / rawPerRow);
    const rawRowW = rawGap + Math.min(chars.length, rawPerRow) * (uniW + rawGap);
    const rawRowH = uniH + 16;
    rawCanvas.width = rawRowW;
    rawCanvas.height = rawRows * rawRowH + rawGap;
    rawCtx.fillStyle = themeColor('bg');
    rawCtx.fillRect(0, 0, rawCanvas.width, rawCanvas.height);
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const row = Math.floor(i / rawPerRow);
      const col = i % rawPerRow;
      const rawX = rawGap + col * (uniW + rawGap);
      const rawY = rawGap + row * rawRowH;
      rawCtx.fillStyle = '#ffffff';
      rawCtx.fillRect(rawX, rawY, uniW, uniH);
      rawCtx.drawImage(c.tempCanvas, rawX, rawY);
      rawCtx.fillStyle = themeColor('accent');
      rawCtx.font = '10px sans-serif';
      rawCtx.textAlign = 'center';
      rawCtx.fillText(c.char, rawX + uniW / 2, rawY + uniH + 12);
    }
  }

  // ---- 渲染点阵预览（从已有矩阵绘制）- 供手动编辑后调用 ----
  window.renderBitmapPreview = function(chars, cellSize) {
    const gap = 16;
    const bitmapPerRow = 10;

    window._bitmapChars = chars;
    window._bitmapCharRects = [];
    window._bitmapCellSize = cellSize;

    const charW = chars[0].width * cellSize;
    const charH = chars[0].height * cellSize + 18;
    const rows = Math.ceil(chars.length / bitmapPerRow);
    const canvasW = Math.min(chars.length, bitmapPerRow) * (charW + gap) + gap;
    const canvasH = rows * charH + gap;

    bitmapCanvas.width = canvasW;
    bitmapCanvas.height = canvasH;
    bitmapCtx.fillStyle = themeColor('bg');
    bitmapCtx.fillRect(0, 0, canvasW, canvasH);

    let totalFg = 0, totalBg = 0;
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const row = Math.floor(i / bitmapPerRow);
      const col = i % bitmapPerRow;
      const x = gap + col * (charW + gap);
      const y = gap + row * charH;
      renderSingleBitmap(bitmapCtx, c.matrix, cellSize, x, y, c.char);
      window._bitmapCharRects.push({ x, y, w: c.width * cellSize, h: c.height * cellSize, idx: i });
      const fgCount = c.matrix.reduce((s, r) => s + r.reduce((a, v) => a + v, 0), 0);
      totalFg += fgCount; totalBg += (c.width * c.height) - fgCount;
    }
    bitmapDims.textContent = t('dimInfo') + chars[0].width + '×' + chars[0].height;
    updateExport();
  }

  // ---- 点阵画布鼠标点击编辑 ----
  bitmapCanvas.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const scaleX = this.width / rect.width;
    const scaleY = this.height / rect.height;
    const px = mx * scaleX;
    const py = my * scaleY;
    const charRects = window._bitmapCharRects || [];
    const chars = window._bitmapChars || [];
    const cs = window._bitmapCellSize || 4;
    for (const cr of charRects) {
      if (px >= cr.x && px < cr.x + cr.w && py >= cr.y && py < cr.y + cr.h) {
        const col = Math.floor((px - cr.x) / cs);
        const row = Math.floor((py - cr.y) / cs);
        if (row >= 0 && row < chars[cr.idx].matrix.length && col >= 0 && col < chars[cr.idx].matrix[0].length) {
          chars[cr.idx].matrix[row][col] = e.button === 2 ? 0 : 1;
          // 保存手动编辑（转换为原始裁剪矩阵坐标，跟随边距偏移移动）
          const pt = parseInt(paddingTop.textContent) || 0;
          const pl = parseInt(paddingLeft.textContent) || 0;
          const ox = parseInt(offsetX.value) || 0;
          const oy = parseInt(offsetY.value) || 0;
          const val = e.button === 2 ? 0 : 1;
          _editDeltas.push({ charIdx: cr.idx, row: row - pt + oy, col: col - pl + ox, val: val });
          window.renderBitmapPreview(chars, window._bitmapCellSize);
        }
        break;
      }
    }

  // ---- 查询本地字库 ---- 
  // 检测优先级: Electron IPC > Local Font Access API > Canvas
  function isLocalFontAPIAvailable() {
    return 'queryLocalFonts' in navigator;
  }

  function isElectronEnv() {
    return typeof window !== 'undefined' && window.electronFonts && window.electronFonts.isElectron;
  }

  async function listLocalFonts() {
    localFontsGroup.style.display = 'flex';

    // 1. Electron 环境 - 通过 Node.js font-list 包获取全部字体
    if (isElectronEnv()) {
      localFontList.innerHTML = '<div class="font-loading">' + t('fontLoading1') + '</div>';
      try {
        const fonts = await window.electronFonts.getFonts();
        if (fonts && fonts.length > 0) {
          allFontsData = fonts.map(f => ({
            family: f,
            styles: 'System',
            postscriptName: f,
            source: 'electron'
          }));
          renderFontList(allFontsData);
          return;
        }
      } catch (err) {
        console.warn('Electron font list failed, fallback Canvas:', err);
      }
    }

    // 2. Local Font Access API
    if (isLocalFontAPIAvailable()) {
      localFontList.innerHTML = '<div class="font-loading">' + t('fontLoading2') + '</div>';
      try {
        const fonts = await navigator.fonts.queryLocalFonts();
        const fontMap = new Map();
        for (const font of fonts) {
          if (!fontMap.has(font.family)) fontMap.set(font.family, []);
          fontMap.get(font.family).push(font);
        }
        allFontsData = [];
        for (const [family, items] of fontMap) {
          allFontsData.push({
            family,
            styles: items.map(f => f.style || 'Regular').join(', '),
            postscriptName: items[0].postscriptName,
            sample: items[0]
          });
        }
        allFontsData.sort((a, b) => a.family.localeCompare(b.family, 'zh-CN'));
        renderFontList(allFontsData);
        return;
      } catch (err) {
        localFontList.innerHTML = `<div class="font-error">⚠ ${err.message}</div>`;
        return;
      }
    }

    // 3. Canvas 回退不可用
    localFontList.innerHTML = '<div class="font-error">' + t('fontError') + '</div>';
  }

  // ---- 字体检测 - 全量字体 + 双模式检测 ---- 

  async function loadLocalFont(familyName) {
    // 查找该字体数据
    const fontData = allFontsData.find(f => f.family === familyName);
    if (!fontData) return;

    const localFamily = 'local_' + familyName;

    // 判断是否来自 Canvas 检测 (无 sample.blob)
    const isCanvasDetected = fontData.source === 'canvas-detect' || !fontData.sample || typeof fontData.sample.blob !== 'function';

    try {
      if (!isCanvasDetected) {
        // 来自 Local Font Access API: 用 blob() 加载
        const blob = await fontData.sample.blob();
        const url = URL.createObjectURL(blob);
        const fontFace = new FontFace(localFamily, `url(${url})`);
        await fontFace.load();
        document.fonts.add(fontFace);
        await document.fonts.ready;

        if (loadedFontUrl) URL.revokeObjectURL(loadedFontUrl);
        loadedFontFamily = localFamily;
        loadedFontUrl    = url;
      } else {
        // Electron / Canvas 检测: 尝试 local() 加载, 失败则直接用系统字体名
        try {
          const fontFace = new FontFace(localFamily, `local("${familyName}")`);
          await fontFace.load();
          document.fonts.add(fontFace);
          await document.fonts.ready;
          if (loadedFontUrl) URL.revokeObjectURL(loadedFontUrl);
          loadedFontFamily = localFamily;
          loadedFontUrl    = null;
        } catch (e) {
          // local() 加载失败, 直接用系统字体名称渲染 (Canvas 可直接使用)
          if (loadedFontUrl) URL.revokeObjectURL(loadedFontUrl);
          loadedFontFamily = familyName;
          loadedFontUrl    = null;
        }
      }

      loadedFontName   = familyName;
      fontName.innerHTML = t('fontLoaded') + ' <strong style="color:#43e97b">' + familyName + '</strong>';
      fontFileInput.value = '';

      // 更新高亮
      localFontList.querySelectorAll('.font-item').forEach(el => {
        el.classList.toggle('active', el.dataset.family === familyName);
      });
      fontShortcuts.querySelectorAll('.btn-shortcut').forEach(el => {
        el.classList.toggle('active', el.dataset.family === familyName);
      });

      scheduleRender();
    } catch (err) {
      fontName.innerHTML = t('fontLoadFail') + ' ' + err.message;
    }
  }

  // ---- 边距步进按钮（支持 Shift 加速 ×10、长按连发） ----
  document.querySelectorAll('.stepper-btn').forEach(btn => {
    function doStep(el) {
      const targetId = el.dataset.target;
      let step = parseInt(el.dataset.step);
      if (step === 0) return;
      // Shift 键 10 倍步进
      const shiftMultiplier = document.__shiftHeld ? 10 : 1;
      step *= shiftMultiplier;
      handleStepper(targetId, step);
    }
    btn.addEventListener('click', function(e) {
      doStep(this);
    });
    // 长按连发：按下 400ms 后开始每 80ms 触发一次
    let holdTimer = null, repeatTimer = null;
    btn.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      holdTimer = setTimeout(() => {
        repeatTimer = setInterval(() => doStep(btn), 80);
      }, 400);
    });
    btn.addEventListener('mouseup', () => { clearTimers(); });
    btn.addEventListener('mouseleave', () => { clearTimers(); });
    function clearTimers() {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
    }
  });

  function handleStepper(targetId, step) {
    const input = document.getElementById(targetId);
    let val;
    if (targetId === 'paddingTop' || targetId === 'paddingBottom' || targetId === 'paddingLeft' || targetId === 'paddingRight') {
      val = parseInt(input.textContent) || 0;
      val = Math.max(-100, Math.min(100, val + step));
      input.textContent = val;
    } else {
      val = parseInt(input.value) || 0;
      const min = parseInt(input.min) || -Infinity;
      const max = parseInt(input.max) || Infinity;
      val = Math.max(min, Math.min(max, val + step));
      input.value = val;

    if (targetId === 'offsetX' || targetId === 'offsetY') updateOffsetDisplay();

  // ---- 导出格式 (逐字) ----
  function generateExport() {
    const text = inputText.value || ' ';
    const fontSize = parseFloat(fontSizeSlider.value);
    const thresholdVal = parseInt(thresholdSlider.value);
    const cellSize = parseInt(cellSizeSlider.value);
    const format = 'carray';

    // 优先使用当前显示的矩阵（含手动编辑），否则重新计算
    let chars, uniW, uniH;
    if (window._bitmapChars && window._bitmapChars.length > 0) {
      chars = window._bitmapChars.map(c => ({
        char: c.char,
        matrix: c.matrix.map(r => [...r]),
        width: c.width, height: c.height
      }));
      uniW = chars[0].width; uniH = chars[0].height;
    } else {
      const rawChars = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '\n' || ch === '\r') continue;
        const result = getBitmapMatrix(ch, fontSize, thresholdVal);
        rawChars.push({ char: ch, ...result });
      }
      if (rawChars.length === 0) {
        const result = getBitmapMatrix(' ', fontSize, thresholdVal);
        rawChars.push({ char: ' ', ...result });
      }
      uniW = 0; uniH = 0;
      for (const c of rawChars) { if (c.width > uniW) uniW = c.width; if (c.height > uniH) uniH = c.height; }
      chars = rawChars.map(c => ({ ...c, matrix: padMatrixToSize(c.matrix, uniW, uniH), width: uniW, height: uniH }));
    }

    const dimName = { '1d': t('dim1d'), '2d': t('dim2d') }[arrayDimSelect.value] || t('dim1d');
    const langName = langSelect.options[langSelect.selectedIndex].text;
    const bytesPerChar = Math.ceil(uniW / 8) * uniH;
    const totalBytes = bytesPerChar * chars.length;
    let output = t('exportHeader', text, chars.length) + '\n';
    output += t('exportFont', loadedFontName, fontSize, thresholdVal) + '\n';
    output += t('exportSize', uniW, uniH) + '\n';
    output += t('exportPadding', paddingTop.textContent, paddingBottom.textContent, paddingLeft.textContent, paddingRight.textContent) + '\n';
    output += t('exportOffset', offsetX.value, offsetY.value) + '\n';
    output += t('exportYinYang', yinYangSelect.value === 'yin' ? t('yinLabel') : t('yangLabel')) + '\n';
    output += t('exportFormat', dimName, langName) + '\n';
    output += t('exportSingleSize', bytesPerChar, totalBytes) + '\n\n';

    for (let ci = 0; ci < chars.length; ci++) {
      const c = chars[ci];
      const { matrix, width, height } = c;

      const charBytes = Math.ceil(width / 8) * height;
      output += t('exportChar', ci+1, c.char, width, height, charBytes) + '\n';

      switch (format) {
        case 'binary': {
          for (let row = 0; row < height; row++) {
            let line = '';
            for (let col = 0; col < width; col++) {
              line += matrix[row][col] === 1 ? '██' : '  ';
            }
            output += line + '\n';
          }
          output += '\n';
          break;
        }
        case 'hex': {
          for (let row = 0; row < height; row++) {
            const parts = [];
            const bytes = Math.ceil(width / 8);
            for (let b = 0; b < bytes; b++) {
              let byteVal = 0;
              const startBit = b * 8;
              for (let bit = 0; bit < 8; bit++) {
                const colIdx = startBit + bit;
                if (colIdx < width && matrix[row][colIdx] === 1) {
                  byteVal |= (1 << (7 - bit));
                }
              }
              parts.push(byteVal.toString(16).toUpperCase().padStart(2, '0'));
            }
            output += parts.join(' ') + '\n';
          }
          output += '\n';
          break;
        }
        case 'carray': {
          const dimMode = arrayDimSelect.value;
          const lang = langSelect.value;

          // ---- 语言语法配置 ----
          const langDefs = {
            'c':       { type: 'const unsigned char', eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
            'arduino': { type: 'const uint8_t',        eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: ' PROGMEM' },
            'python':  { type: '',                     eq: '=', braceS: '[', braceE: ']', semi: '',  suffix: '' },
            'go':      { type: 'var',                  eq: '=', braceS: '{', braceE: '}', semi: '',  suffix: '' },
            'rust':    { type: 'const',                eq: '=', braceS: '{', braceE: '}', semi: ',', suffix: '' },
            'java':    { type: 'static final byte[]',  eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
            'csharp':  { type: 'static readonly byte[]',eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
            'js':      { type: 'const',                eq: '=', braceS: '[', braceE: ']', semi: ',', suffix: '' }
          };
          const L = langDefs[lang] || langDefs.c;

          function carHeader(name, dim) {
            if (lang === 'python') return `${name} = [\n`;
            if (lang === 'go') return `${L.type} ${name} = [${dim}]byte {\n`;
            if (lang === 'rust') return `${L.type} ${name.toUpperCase()}: [[u8; ${dim.split('][')[1]}]; ${dim.split('][')[0]}] ${L.eq} {\n`;
            if (lang === 'java') return `${L.type} ${name} = {\n`;
            if (lang === 'csharp') return `${L.type} ${name} = {\n`;
            if (lang === 'js') return `${L.type} ${name} = [\n`;
            return `${L.type} ${name}[${dim}]${L.suffix} ${L.eq} {\n`;
          }
          function carFooter() {
            if (lang === 'python' || lang === 'js') return `${L.braceE}${L.semi}\n\n`;
            return `${L.braceE}${L.semi}\n\n`;
          }
          function carHex(v) {
            if (lang === 'python') return String(v);
            return '0x' + v.toString(16).toUpperCase().padStart(2, '0');
          }
          function carRow(arr, last) {
            if (lang === 'python') return '    [' + arr.join(', ') + ']' + (last ? '' : ',');
            if (lang === 'go')     return '  {' + arr.join(', ') + '},';
            if (lang === 'js')     return '  [' + arr.join(', ') + ']' + (last ? '' : ',');
            if (lang === 'rust')   return '  [' + arr.join(', ') + '],';
            return '  {' + arr.join(', ') + '}' + (last ? '' : ',');
          }

          const bytesPerRow = Math.ceil(width / 8);
          const name = `char${ci}`;

          if (dimMode === '2d') {
            // 逐位展开
            output += carHeader(name, `${height}][${width}`);
            for (let r = 0; r < height; r++) {
              const vals = [];
              for (let c = 0; c < width; c++) vals.push(lang === 'python' ? matrix[r][c] : matrix[r][c]);
              output += carRow(vals, r === height - 1) + '\n';
            }
            output += carFooter();
          } else {
            // 字节压缩 / 字节展开
            output += carHeader(name, `${height}][${bytesPerRow}`);
            for (let r = 0; r < height; r++) {
              const byteVals = [];
              for (let b = 0; b < bytesPerRow; b++) {
                let v = 0;
                for (let bit = 0; bit < 8; bit++) {
                  const col = b * 8 + bit;
                  if (col < width && matrix[r][col] === 1) v |= (1 << (7 - bit));
                }
                byteVals.push(carHex(v));
              }
              output += carRow(byteVals, r === height - 1) + '\n';
            }
            output += carFooter();
          }
          break;
        }
        case 'carray2d': {
          // 始终二维逐位展开
          output += `const unsigned char char${ci}[${height}][${width}] = {\n`;
          for (let row = 0; row < height; row++) {
            output += '  {';
            const vals = [];
            for (let col = 0; col < width; col++) {
              vals.push(matrix[row][col]);
            }
            output += vals.join(', ');
            output += row < height - 1 ? '},\n' : '}\n';
          }
          output += '};\n\n';
          break;
        }
        case 'python': {
          output += `# char "${c.char}" ${width}x${height}\n`;
          output += `char${ci} = [\n`;
          for (let row = 0; row < height; row++) {
            output += '    [';
            const vals = [];
            for (let col = 0; col < width; col++) {
              vals.push(matrix[row][col]);
            }
            output += vals.join(', ');
            output += row < height - 1 ? '],\n' : ']\n';
          }
          output += ']\n\n';
          break;
        }
        case 'csv': {
          const headers = [];
          for (let col = 0; col < width; col++) headers.push(`C${col}`);
          output += `# char "${c.char}" ${width}x${height}\n`;
          output += headers.join(',') + '\n';
          for (let row = 0; row < height; row++) {
            output += matrix[row].join(',') + '\n';
          }
          output += '\n';
          break;
        }
        case 'json': {
          if (ci === 0) {
            output = JSON.stringify({
              text: text,
              fontSize: fontSize,
              threshold: thresholdVal,
              cellSize: cellSize,
              unifiedSize: { width: uniW, height: uniH },
              padding: { top: parseInt(paddingTop.textContent), bottom: parseInt(paddingBottom.textContent), left: parseInt(paddingLeft.textContent), right: parseInt(paddingRight.textContent) },
              offset: { x: parseInt(offsetX.value), y: parseInt(offsetY.value) },
              chars: chars.map((ch, idx) => ({
                index: idx,
                char: ch.char,
                matrix: ch.matrix
              }))
            }, null, 2);
          }
          break;
        }
      }
    }

    return output;
  }

    const extMap = { 'c':'c', 'arduino':'h', 'python':'py', 'go':'go', 'rust':'rs', 'java':'java', 'csharp':'cs', 'js':'js' };
    const ext = extMap[langSelect.value] || 'c';

    a.href = url;
    a.download = `bitmap_export.${ext}`;

  function t(key, ...args) {
    const dict = LANG[currentLang] || LANG['zh-cn'];
    let str = dict[key];
    if (str === undefined) str = LANG['zh-cn'][key];
    if (str === undefined) return key;
    if (args.length) str = str.replace(/\{(\d+)\}/g, (m, i) => args[i] !== undefined ? args[i] : m);
    return str;
  }

  function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem('fontbitmap_lang', lang);
    document.title = t('appTitle');
    const h1 = document.querySelector('h1');
    if (h1) h1.textContent = t('appTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
      if (el.tagName === 'OPTION') { el.textContent = t(key); return; }
      el.textContent = t(key);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = t(el.dataset.i18nTitle);
    });
    // 单独处理字体名称显示
    const fnEl = document.getElementById('fontName');
    if (fnEl && !loadedFontFamily) {
      fnEl.textContent = t('loadedFont');
    } else if (fnEl && loadedFontName) {
      fnEl.innerHTML = t('fontLoaded') + ' <strong style="color:#43e97b">' + loadedFontName + '</strong>';
    }
    // 处理带值显示的标签（仅替换文本节点，保留原 span 元素引用）
    const labelMap = { fontSizeLabel:'fontSize', cellSizeLabel:'cellSize', offsetLabel:'offset', thresholdLabel:'threshold' };
    for (const [id, key] of Object.entries(labelMap)) {
      const el = document.getElementById(id);
      if (!el) continue;
      // 找到第一个文本节点并替换其内容
      const nodes = Array.from(el.childNodes);
      const textNode = nodes.find(n => n.nodeType === 3 && n.textContent.trim());
      if (textNode) {
        textNode.textContent = t(key);
      } else {
        // 如果没有独立的文本节点，在前面插入
        const span = el.querySelector('.value-display');
        if (span) el.insertBefore(document.createTextNode(t(key) + ' '), span);
      }
    }
  }

  function showModal(opts) {
    return new Promise((resolve) => {
      modal.title.textContent = opts.title || '';
      modal.title.style.display = opts.title ? '' : 'none';
      modal.body.innerHTML = opts.html || '';
      modal.footer.innerHTML = '';
      if (opts.width) modal.box.style.width = opts.width;

      if (opts.cancelText !== false) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-primary';
        cancelBtn.textContent = opts.cancelText || t('cancel');
        cancelBtn.style.minWidth = '70px';
        cancelBtn.addEventListener('click', () => { closeModal(); resolve(null); });
        modal.footer.appendChild(cancelBtn);
      }

      if (opts.confirmText !== false) {
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn btn-primary';
        confirmBtn.textContent = opts.confirmText || t('confirm');
        confirmBtn.style.minWidth = '70px';
        confirmBtn.addEventListener('click', () => {
          const val = opts.getValue ? opts.getValue() : true;
          closeModal();
          resolve(val);
        });
        modal.footer.appendChild(confirmBtn);
      }

      modal.overlay.classList.add('open');
      const firstInput = modal.body.querySelector('input,select');
      if (firstInput) setTimeout(() => firstInput.focus(), 50);

      const keyHandler = (e) => {
        if (e.key === 'Escape') { closeModal(); resolve(null); }
      };
      document.addEventListener('keydown', keyHandler);
      modal.overlay.addEventListener('click', (e) => {
        if (e.target === modal.overlay) { closeModal(); resolve(null); }
      });
    });
