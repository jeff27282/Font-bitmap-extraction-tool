  // 色彩模式转换
  function quantizeColor(r, g, b, a, mode) {
    if (a < 128) return { r: 0, g: 0, b: 0 }; // 透明像素变黑
    switch (mode) {
      case 'bw': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const isFg = gray > 127;
        const isYin = document.getElementById('yinYangSelect')?.value === 'yin';
        const v = (isYin ? !isFg : isFg) ? 255 : 0;
        return { r: v, g: v, b: v };
      }
      case 'grayscale4': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const inv = document.getElementById('yinYangSelect')?.value === 'yin' ? (255 - gray) : gray;
        const q = Math.round(inv / 17) * 17;
        return { r: q, g: q, b: q };
      }
      case 'grayscale8': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const v = document.getElementById('yinYangSelect')?.value === 'yin' ? (255 - gray) : gray;
        return { r: v, g: v, b: v };
      }
      case 'rgb332': {
        const rr = (r >> 5) * 36;   // 3bit → 0,36,73,109,146,182,219,255
        const gg = (g >> 5) * 36;
        const bb = (b >> 6) * 85;   // 2bit → 0,85,170,255
        return { r: rr, g: gg, b: bb };
      }
      case 'rgb565': {
        const rr = (r >> 3) * 8 + (r >> 5);  // 5bit → 0-255
        const gg = (g >> 2) * 4 + (g >> 4);  // 6bit → 0-255
        const bb = (b >> 3) * 8 + (b >> 5);  // 5bit → 0-255
        return { r: rr, g: gg, b: bb };
      }
      case 'rgba':
      case 'rgb888':
      default:
        return { r, g, b };
    }
  }

  let _imageEdits = {}; // 用户手动编辑的像素 {"row_col": {r,g,b}}
  let _imageOriginalData = null; // 原始采样数据缓存

  function renderImageBitmap(keepEdits) {
    if (!_loadedImage) {
      bitmapCanvas.width = 0;
      bitmapCanvas.height = 0;
      bitmapDims.textContent = '';
      exportOutput.value = '';
      return;
    }

    const cellSize = parseInt(cellSizeSlider.value);
    const colorMode = document.getElementById('imageColorMode').value;
    const targetW = parseInt(imageWidthSlider.value) || 128;
    const ratio = targetW / _loadedImage.naturalWidth;
    const targetH = Math.round(_loadedImage.naturalHeight * ratio);
    const gridW = Math.max(1, targetW);
    const gridH = Math.max(1, targetH);
    const pt = parseInt(paddingTop.textContent) || 0;
    const pb = parseInt(paddingBottom.textContent) || 0;
    const pl = parseInt(paddingLeft.textContent) || 0;
    const pr = parseInt(paddingRight.textContent) || 0;
    const ox = parseInt(offsetX.value) || 0;
    const oy = parseInt(offsetY.value) || 0;
    const totalW = Math.max(1, gridW + pl + pr);
    const totalH = Math.max(1, gridH + pt + pb);

    // 尺寸变了或首次加载 → 清空编辑
    if (!keepEdits || !_imageBitmapData || _imageBitmapData.length !== gridH || (_imageBitmapData[0] && _imageBitmapData[0].length !== gridW)) {
      _imageEdits = {};
    }

    const hasBaseData = _imageBitmapData && _imageBitmapData.length === gridH && _imageBitmapData[0] && _imageBitmapData[0].length === gridW;

    if (keepEdits && hasBaseData && _imageEdits && Object.keys(_imageEdits).length > 0) {
      // 快速路径：只应用编辑，不重新采样原图
      for (const key of Object.keys(_imageEdits)) {
        const parts = key.split('_');
        const r = parseInt(parts[0]), c = parseInt(parts[1]);
        if (r >= 0 && r < gridH && c >= 0 && c < gridW) {
          _imageBitmapData[r][c] = { ..._imageEdits[key] };
        }
      }
    } else if (keepEdits && hasBaseData && (!_imageEdits || Object.keys(_imageEdits).length === 0)) {
      // 没有编辑，直接复用已有数据
    } else {
      // 全量路径：重新采样原图
      _imageEdits = {};
      const offCanvas = document.createElement('canvas');
      offCanvas.width = gridW;
      offCanvas.height = gridH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(_loadedImage, 0, 0, gridW, gridH);
      const imgData = offCtx.getImageData(0, 0, gridW, gridH).data;

      _imageBitmapData = [];
      _imageOriginalData = []; // 缓存原始采样数据
      for (let row = 0; row < gridH; row++) {
        const rowData = [];
        const origRow = [];
        for (let col = 0; col < gridW; col++) {
          const idx = (row * gridW + col) * 4;
          const c = quantizeColor(imgData[idx], imgData[idx+1], imgData[idx+2], imgData[idx+3], colorMode);
          rowData.push(c);
          origRow.push({ ...c });
        }
        _imageBitmapData.push(rowData);
        _imageOriginalData.push(origRow);
      }
    }

    // 应用边距 + 偏移构建显示矩阵
    const ctx = bitmapCanvas.getContext('2d');
    const canvasW = totalW * cellSize;
    const canvasH = totalH * cellSize;

    // 快速路径：仅重绘变化的格子
    if (keepEdits && _drawingState && _imageEdits && Object.keys(_imageEdits).length > 0) {
      const editKeys = Object.keys(_imageEdits);
      for (const key of editKeys) {
        const parts = key.split('_');
        const r = parseInt(parts[0]), c = parseInt(parts[1]);
        // 基座标 → 显示坐标：displayRow = baseRow + pt - oy, displayCol = baseCol + pl - ox
        const dr = r + pt - oy;
        const dc = c + pl - ox;
        if (dr >= 0 && dr < totalH && dc >= 0 && dc < totalW) {
          const px = _imageBitmapData[r][c];
          const x = dc * cellSize;
          const y = dr * cellSize;
          ctx.fillStyle = `rgb(${px.r},${px.g},${px.b})`;
          ctx.fillRect(x, y, cellSize, cellSize);
        }
      }
      bitmapDims.textContent = `点阵: ${totalW}×${totalH}`;
      if (!_drawingState) exportOutput.value = generateImageExport();
      return;
    }

    // 全量渲染
    const displayData = [];
    for (let row = 0; row < totalH; row++) {
      const rowData = [];
      for (let col = 0; col < totalW; col++) {
        const srcRow = row - pt + oy;
        const srcCol = col - pl + ox;
        if (srcRow >= 0 && srcRow < gridH && srcCol >= 0 && srcCol < gridW) {
          rowData.push(_imageBitmapData[srcRow][srcCol]);
        } else {
          rowData.push({ r: 0, g: 0, b: 0 });
        }
      }
      displayData.push(rowData);
    }

    bitmapCanvas.width = canvasW;
    bitmapCanvas.height = canvasH;
    window._bitmapCellSize = cellSize;
    for (let row = 0; row < totalH; row++) {
      for (let col = 0; col < totalW; col++) {
        const c = displayData[row][col];
        const x = col * cellSize;
        const y = row * cellSize;
        ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
        ctx.fillRect(x, y, cellSize, cellSize);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x, y, cellSize, cellSize);
      }
    }
    bitmapDims.textContent = `点阵: ${totalW}×${totalH}`;
    if (!_drawingState) exportOutput.value = generateImageExport();
  }

  function renderImageMode() {
    const imgEl = document.getElementById('originalImage');
    const placeholder = document.getElementById('imagePlaceholder');
    if (_loadedImage) {
      const targetW = parseInt(imageWidthSlider.value) || 128;
      const ratio = targetW / _loadedImage.naturalWidth;
      const targetH = Math.round(_loadedImage.naturalHeight * ratio);
      imgEl.src = _loadedImage.src;
      imgEl.style.width = targetW + 'px';
      imgEl.style.height = targetH + 'px';
      imgEl.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      imgEl.style.display = 'none';
      placeholder.style.display = 'inline';
    }
    rawCanvas.width = 0;
    rawCanvas.height = 0;
    _imageEdits = {};
    _imageUndoStack = [];
    renderImageBitmap();
    updateToolButtons();
  }

  // ---- 图片导出 ----
  function generateImageExport() {
    if (!_imageBitmapData || _imageBitmapData.length === 0) return '';
    // 对导出数据也应用边距/偏移
    const gridH = _imageBitmapData.length;
    const gridW = _imageBitmapData[0].length;
    const pt = parseInt(paddingTop.textContent) || 0;
    const pb = parseInt(paddingBottom.textContent) || 0;
    const pl = parseInt(paddingLeft.textContent) || 0;
    const pr = parseInt(paddingRight.textContent) || 0;
    const ox = parseInt(offsetX.value) || 0;
    const oy = parseInt(offsetY.value) || 0;
    let w = Math.max(1, gridW + pl + pr);
    let h = Math.max(1, gridH + pt + pb);
    // 输出区域裁剪
    let areaX = 0, areaY = 0, areaW = w, areaH = h;
    if (_outputAreaActive && _outputArea) {
      areaX = Math.max(0, Math.min(_outputArea.x, w - 1));
      areaY = Math.max(0, Math.min(_outputArea.y, h - 1));
      areaW = Math.max(1, Math.min(_outputArea.w, w - areaX));
      areaH = Math.max(1, Math.min(_outputArea.h, h - areaY));
    }
    const colorMode = document.getElementById('imageColorMode').value;
    const lang = langSelect.value;
    const isCropped = _outputAreaActive && _outputArea && (areaX !== 0 || areaY !== 0 || areaW !== w || areaH !== h);
    const exportW = isCropped ? areaW : w;
    const exportH = isCropped ? areaH : h;
    const bytesPerPixel = { 'bw': 0.125, 'grayscale4': 0.5, 'grayscale8': 1, 'rgb332': 1, 'rgb565': 2, 'rgb888': 3, 'rgba': 4 }[colorMode] || 1;
    const totalBytes = Math.ceil(exportW * exportH * bytesPerPixel);
    const colorModeNames = { 'bw': t('clrBW'), 'grayscale4': t('clrGray4'), 'grayscale8': t('clrGray8'), 'rgb332': t('clrRGB332'), 'rgb565': t('clrRGB565'), 'rgb888': t('clrRGB888'), 'rgba': t('clrRGBA') };
    const fileName = document.getElementById('imageFileName').textContent || t('exportNoName');
    const yinYang = yinYangSelect.value === 'yin' ? t('exportYin') : t('exportYang');
    let output = t('exportImageTitle') + '\n';
    output += t('exportImageSource', fileName) + '\n';
    output += t('exportImageSize', gridW, gridH, w, h) + '\n';
    output += t('exportColorMode', colorModeNames[colorMode] || colorMode) + '\n';
    output += '// 边距(T/B/L/R): ' + pt + '/' + pb + '/' + pl + '/' + pr + '\n';
    output += '// 偏移(X/Y): ' + ox + '/' + oy + '\n';
    if (isCropped) output += '// 输出区域: (' + areaX + ',' + areaY + ') ' + exportW + '×' + exportH + '\n';
    output += t('exportYinYang', yinYang) + '\n';
    output += t('exportPixelSize', bytesPerPixel, totalBytes) + '\n\n';

    const langDefs = {
      'c':       { type: 'const unsigned char', eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
      'arduino': { type: 'const uint8_t',        eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: ' PROGMEM' },
      'python':  { type: '',                     eq: '=', braceS: '[', braceE: ']', semi: '',  suffix: '' },
      'go':      { type: 'var',                  eq: '=', braceS: '{', braceE: '}', semi: '',  suffix: '' },
      'rust':    { type: 'const',                eq: '=', braceS: '{', braceE: '}', semi: ',', suffix: '' },
      'java':    { type: 'static final byte[]',  eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
      'csharp':  { type: 'static readonly byte[]',eq: '=', braceS: '{', braceE: '}', semi: ';', suffix: '' },
      'js':      { type: 'const',                eq: '=', braceS: '[', braceE: ']', semi: ',', suffix: '' }
    };
    const L = langDefs[lang] || langDefs.c;

    const dim3d = colorMode === 'rgba' ? '][4' : (colorMode === 'rgb888' || colorMode === 'rgb332' ? '][3' : '');
    const pixStr = colorMode === 'rgb565' ? 'uint16_t' : (colorMode === 'rgba' ? 'uint32_t' : '');
    const L2 = lang === 'c' || lang === 'arduino' ? { ...L, type: pixStr || L.type } : L;

    function imgHeader(name, dim) {
      if (lang === 'python') return name + ' = [\n';
      if (lang === 'go') return L2.type + ' ' + name + ' = [' + dim + ']byte {\n';
      if (lang === 'rust') return L2.type + ' ' + name.toUpperCase() + ': [[u8; ' + dim.split('][')[1] + ']; ' + dim.split('][')[0] + '] ' + L2.eq + ' {\n';
      if (lang === 'java') return L2.type + ' ' + name + ' = {\n';
      if (lang === 'csharp') return L2.type + ' ' + name + ' = {\n';
      if (lang === 'js') return L2.type + ' ' + name + ' = [\n';
      return L2.type + ' ' + name + '[' + dim + ']' + L2.suffix + ' ' + L2.eq + ' {\n';
    }
    function imgFooter() {
      if (lang === 'python' || lang === 'js') return L.braceE + L.semi + '\n\n';
      return L.braceE + L.semi + '\n\n';
    }

    output += imgHeader('canvas0', exportH + '][' + exportW + dim3d);

    function getPx(row, col) {
      const srcRow = row - pt + oy;
      const srcCol = col - pl + ox;
      if (srcRow >= 0 && srcRow < gridH && srcCol >= 0 && srcCol < gridW) {
        return _imageBitmapData[srcRow][srcCol];
      }
      return { r: 0, g: 0, b: 0 };
    }

    if (colorMode === 'bw') {
      // 黑白：逐位 0/1（quantizeColor 已处理阴阳码）
      for (let r = areaY; r < areaY + areaH; r++) {
        const vals = [];
        for (let c = areaX; c < areaX + areaW; c++) {
          vals.push(getPx(r, c).r > 127 ? '1' : '0');
        }
        output += (lang === 'python' ? '    [' : '  {') + vals.join(', ') + (lang === 'python' ? '],\n' : '},\n');
      }
    } else if (colorMode === 'grayscale4' || colorMode === 'grayscale8') {
      for (let r = areaY; r < areaY + areaH; r++) {
        const vals = [];
        for (let c = areaX; c < areaX + areaW; c++) {
          const gray = getPx(r, c).r;
          if (lang === 'python' || lang === 'js') {
            vals.push(String(gray));
          } else {
            vals.push('0x' + gray.toString(16).toUpperCase().padStart(2, '0'));
          }
        }
        output += (lang === 'python' ? '    [' : '  {') + vals.join(', ') + (lang === 'python' ? '],\n' : '},\n');
      }
    } else if (colorMode === 'rgb565') {
      for (let r = areaY; r < areaY + areaH; r++) {
        const vals = [];
        for (let c = areaX; c < areaX + areaW; c++) {
          const px = getPx(r, c);
          const val = ((px.r >> 3) << 11) | ((px.g >> 2) << 5) | (px.b >> 3);
          vals.push('0x' + val.toString(16).toUpperCase().padStart(4, '0'));
        }
        output += '  {' + vals.join(', ') + '},\n';
      }
    } else {
      for (let r = areaY; r < areaY + areaH; r++) {
        const vals = [];
        for (let c = areaX; c < areaX + areaW; c++) {
          const px = getPx(r, c);
          if (lang === 'python' || lang === 'js') {
            vals.push('[' + px.r + ',' + px.g + ',' + px.b + ']');
          } else {
            vals.push('{0x' + px.r.toString(16).toUpperCase().padStart(2, '0') +
                     ',0x' + px.g.toString(16).toUpperCase().padStart(2, '0') +
                     ',0x' + px.b.toString(16).toUpperCase().padStart(2, '0') + '}');
          }
        }
        output += (lang === 'python' ? '    [' : '  {') + vals.join(', ') + (lang === 'python' ? '],\n' : '},\n');
      }
    }
    output += imgFooter();
    return output;
  }

  document.getElementById('imageFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        _loadedImage = img;
        _savedOutputArea = null; // 新图片清除上次线框记忆
        document.getElementById('imageFileName').textContent = t('imageLoaded', file.name);
        updateToolButtons();
        if (document.body.classList.contains('mode-image')) {
          renderImageMode();
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---- 色彩模式切换触发重绘 ----
  document.getElementById('imageColorMode').addEventListener('change', function() {
    const mode = this.value;
    const yinYang = document.getElementById('yinYangSelect');
    const isGrayOrBw = mode === 'bw' || mode === 'grayscale4' || mode === 'grayscale8';
    yinYang.disabled = !isGrayOrBw;
    yinYang.style.opacity = isGrayOrBw ? '1' : '0.4';
    yinYang.style.pointerEvents = isGrayOrBw ? 'auto' : 'none';
    if (document.body.classList.contains('mode-image')) {
      renderImageBitmap(true);
    }
  });

  // ---- 吸笔工具 ----
  let _eyedropperActive = false;
  let _pickedColor = { r: 0, g: 0, b: 0 };
  const eyedropperBtn = document.getElementById('eyeDropperBtn');
  const colorPreview = document.getElementById('colorPreview');
  const colorHex = document.getElementById('colorHex');
  const magnifier = document.getElementById('magnifier');
  const magCanvas = document.getElementById('magCanvas');
  const magCtx = magCanvas.getContext('2d');
  const magColor = document.getElementById('magColor');

  magCanvas.width = 120; magCanvas.height = 120;
  const MAG_RADIUS = 4; // 放大镜采样半径（像素）

  function formatColorValue(r, g, b) {
    const mode = document.getElementById('imageColorMode')?.value || 'rgb888';
    switch (mode) {
      case 'bw': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        return gray > 127 ? '1' : '0';
      }
      case 'grayscale4': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const q = Math.round(gray / 17);
        return '0x' + q.toString(16).toUpperCase();
      }
      case 'grayscale8': {
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        return '0x' + gray.toString(16).toUpperCase().padStart(2, '0');
      }
      case 'rgb332': {
        const rr = (r >> 5) & 7, gg = (g >> 5) & 7, bb = (b >> 6) & 3;
        const val = (rr << 5) | (gg << 2) | bb;
        return '0x' + val.toString(16).toUpperCase().padStart(2, '0');
      }
      case 'rgb565': {
        const val = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
        return '0x' + val.toString(16).toUpperCase().padStart(4, '0');
      }
      case 'rgba':
        return '#' + [r,g,b,255].map(v => v.toString(16).toUpperCase().padStart(2,'0')).join('');
      case 'rgb888':
      default:
        return '#' + [r,g,b].map(v => v.toString(16).toUpperCase().padStart(2,'0')).join('');
    }
  }

  let _colorHistory = [];
  const colorHistoryEl = document.getElementById('colorHistory');

  function addColorToHistory(r, g, b) {
    const hex = '#' + [r,g,b].map(v => v.toString(16).toUpperCase().padStart(2,'0')).join('');
    if (_colorHistory.some(c => c.r === r && c.g === g && c.b === b)) return; // 去重
    _colorHistory.push({ r, g, b });
    if (_colorHistory.length > 20) _colorHistory.shift(); // 最多20个
    renderColorHistory();
  }

  function renderColorHistory() {
    colorHistoryEl.innerHTML = _colorHistory.map((c, i) => {
      const hex = '#' + [c.r,c.g,c.b].map(v => v.toString(16).toUpperCase().padStart(2,'0')).join('');
      return `<div class="hist-color" data-idx="${i}" style="width:22px;height:22px;border-radius:3px;background:${hex};border:1px solid var(--border);cursor:pointer" title="${hex}"></div>`;
    }).join('');
    // 点击历史色块设为当前笔色
    colorHistoryEl.querySelectorAll('.hist-color').forEach(el => {
      el.addEventListener('click', function() {
        const idx = parseInt(this.dataset.idx);
        const c = _colorHistory[idx];
        if (c) updatePickedColor(c.r, c.g, c.b);
      });
    });
  }

  document.getElementById('clearColorBtn').addEventListener('click', function() {
    _colorHistory = [];
    colorHistoryEl.innerHTML = '';
  });

  function updatePickedColor(r, g, b) {
    _pickedColor = { r, g, b };
    const display = formatColorValue(r, g, b);
    colorPreview.style.background = `rgb(${r},${g},${b})`;
    colorHex.textContent = display;
    magColor.textContent = display;
    addColorToHistory(r, g, b);
  }

  function sampleImageColor(clientX, clientY) {
    const img = document.getElementById('originalImage');
    if (!_loadedImage || img.style.display === 'none') return null;
    const rect = img.getBoundingClientRect();
    const scaleX = _loadedImage.naturalWidth / rect.width;
    const scaleY = _loadedImage.naturalHeight / rect.height;
    const imgX = Math.round((clientX - rect.left) * scaleX);
    const imgY = Math.round((clientY - rect.top) * scaleY);
    if (imgX < 0 || imgX >= _loadedImage.naturalWidth || imgY < 0 || imgY >= _loadedImage.naturalHeight) return null;
    // 在离屏 canvas 上采样
    const off = document.createElement('canvas');
    off.width = 1; off.height = 1;
    const octx = off.getContext('2d');
    octx.drawImage(_loadedImage, imgX, imgY, 1, 1, 0, 0, 1, 1);
    const d = octx.getImageData(0,0,1,1).data;
    return { r: d[0], g: d[1], b: d[2], x: imgX, y: imgY };
  }

  function updateMagnifier(clientX, clientY) {
    if (!_loadedImage) return;
    const img = document.getElementById('originalImage');
    const rect = img.getBoundingClientRect();
    const scaleX = _loadedImage.naturalWidth / rect.width;
    const scaleY = _loadedImage.naturalHeight / rect.height;
    const cx = (clientX - rect.left) * scaleX;
    const cy = (clientY - rect.top) * scaleY;
    if (cx < 0 || cx >= _loadedImage.naturalWidth || cy < 0 || cy >= _loadedImage.naturalHeight) return;
    // 在放大镜 canvas 上绘制放大区域
    magCtx.fillStyle = '#fff';
    magCtx.fillRect(0,0,120,120);
    const step = 120 / (MAG_RADIUS * 2 + 1);
    for (let dy = -MAG_RADIUS; dy <= MAG_RADIUS; dy++) {
      for (let dx = -MAG_RADIUS; dx <= MAG_RADIUS; dx++) {
        const sx = Math.round(cx + dx);
        const sy = Math.round(cy + dy);
        if (sx < 0 || sx >= _loadedImage.naturalWidth || sy < 0 || sy >= _loadedImage.naturalHeight) continue;
        const off = document.createElement('canvas');
        off.width = 1; off.height = 1;
        const octx = off.getContext('2d');
        octx.drawImage(_loadedImage, sx, sy, 1, 1, 0, 0, 1, 1);
        const d = octx.getImageData(0,0,1,1).data;
        magCtx.fillStyle = `rgb(${d[0]},${d[1]},${d[2]})`;
        magCtx.fillRect((dx + MAG_RADIUS) * step, (dy + MAG_RADIUS) * step, step + 0.5, step + 0.5);
      }
    }
    // 中心十字
    magCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    magCtx.lineWidth = 1;
    magCtx.beginPath();
    magCtx.moveTo(60, 0); magCtx.lineTo(60, 120);
    magCtx.moveTo(0, 60); magCtx.lineTo(120, 60);
    magCtx.stroke();
  }

  eyedropperBtn.addEventListener('click', function() {
    _eyedropperActive = !_eyedropperActive;
    this.classList.toggle('btn-primary', _eyedropperActive);
    this.classList.toggle('btn-active', _eyedropperActive);
    if (_eyedropperActive && _loadedImage) {
      magnifier.style.display = 'none';
    } else {
      magnifier.style.display = 'none';
      if (!_loadedImage) {
        _eyedropperActive = false;
        this.classList.remove('btn-primary', 'btn-active');
      }
    }
    document.getElementById('originalImage').classList.toggle('eyedropper-active', _eyedropperActive);
    // 互斥：关闭画笔和输出区域
    if (_eyedropperActive) {
      if (_drawBrushActive) {
        _drawBrushActive = false;
        drawBrushBtn.classList.remove('btn-primary', 'btn-active');
      }
      if (_outputAreaActive) deactivateOutputArea();
    }
  });

  // 吸笔/画笔 - 鼠标在点阵画布上跟随放大镜
  bitmapCanvas.addEventListener('mousemove', handleMagMove);
  bitmapCanvas.addEventListener('mousedown', handleMagMove);

  function handleMagMove(e) {
    const showMag = _eyedropperActive || _drawBrushActive;
    if (!showMag) { magnifier.style.display = 'none'; return; }
    if (!_imageBitmapData) {
      // 无图片数据时显示默认提示
      magCtx.fillStyle = '#fff';
      magCtx.fillRect(0, 0, 120, 120);
      magCtx.fillStyle = '#888';
      magCtx.font = '12px sans-serif';
      magCtx.textAlign = 'center';
      magCtx.fillText(t('importImageFirst'), 60, 60);
      magColor.textContent = '🔍 无数据';
      magnifier.style.display = 'block';
      magnifier.style.left = e.clientX + 'px';
      magnifier.style.top = (e.clientY + 120) + 'px';
      return;
    }
    const rect = this.getBoundingClientRect();
    const scaleX = this.width / rect.width;
    const scaleY = this.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const cellSize = parseInt(cellSizeSlider.value);
    const col = Math.floor(mx / cellSize);
    const row = Math.floor(my / cellSize);
    if (row < 0 || row >= _imageBitmapData.length || col < 0 || col >= _imageBitmapData[0].length) {
      magnifier.style.display = 'none'; return;
    }
    // 在放大镜中绘制 5×5 像素块
    const R = 2; // 半径
    magCtx.fillStyle = '#fff';
    magCtx.fillRect(0, 0, 120, 120);
    const step = 120 / (R * 2 + 1);
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        const r = row + dr, c = col + dc;
        if (r >= 0 && r < _imageBitmapData.length && c >= 0 && c < _imageBitmapData[0].length) {
          const px = _imageBitmapData[r][c];
          magCtx.fillStyle = `rgb(${px.r},${px.g},${px.b})`;
        } else {
          magCtx.fillStyle = '#888';
        }
        magCtx.fillRect((dc + R) * step, (dr + R) * step, step + 0.5, step + 0.5);
      }
    }
    // 中心十字
    magCtx.strokeStyle = 'rgba(255,255,255,0.7)';
    magCtx.lineWidth = 1;
    magCtx.beginPath();
    magCtx.moveTo(60, 0); magCtx.lineTo(60, 120);
    magCtx.moveTo(0, 60); magCtx.lineTo(120, 60);
    magCtx.stroke();
    // 显示颜色值 - 绘制模式显示笔色，吸笔模式显示像素色
    if (_drawBrushActive) {
      const display = formatColorValue(_pickedColor.r, _pickedColor.g, _pickedColor.b);
      magColor.textContent = '✏️ ' + display;
    } else {
      const px = _imageBitmapData[row][col];
      const display = formatColorValue(px.r, px.g, px.b);
      magColor.textContent = '🔍 ' + display;
    }
    // 定位放大镜
    magnifier.style.display = 'block';
    magnifier.style.left = e.clientX + 'px';
    magnifier.style.top = (e.clientY + 120) + 'px';
  }

  bitmapCanvas.addEventListener('mouseleave', function() {
    if (_eyedropperActive || _drawBrushActive) magnifier.style.display = 'none';
  });

  // ---- 绘制按钮 ----
  let _drawBrushActive = false;
  const drawBrushBtn = document.getElementById('drawBrushBtn');

  drawBrushBtn.addEventListener('click', function() {
    _drawBrushActive = !_drawBrushActive;
    this.classList.toggle('btn-primary', _drawBrushActive);
    this.classList.toggle('btn-active', _drawBrushActive);
    if (!_loadedImage && _drawBrushActive) {
      _drawBrushActive = false;
      this.classList.remove('btn-primary', 'btn-active');
      return;
    }
    // 互斥：关闭吸笔和输出区域
    if (_drawBrushActive) {
      if (_eyedropperActive) {
        _eyedropperActive = false;
        eyedropperBtn.classList.remove('btn-primary', 'btn-active');
        magnifier.style.display = 'none';
      }
      if (_outputAreaActive) deactivateOutputArea();
    }
  });

  // 吸笔取色 - 点击点阵画布取色（一直吸，不退出），右键退出吸笔模式
  bitmapCanvas.addEventListener('click', function(e) {
    if (!_eyedropperActive || !_imageBitmapData) return;
    const rect = this.getBoundingClientRect();
    const scaleX = this.width / rect.width;
    const scaleY = this.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const cellSize = parseInt(cellSizeSlider.value);
    const col = Math.floor(mx / cellSize);
    const row = Math.floor(my / cellSize);
    if (row < 0 || row >= _imageBitmapData.length || col < 0 || col >= _imageBitmapData[0].length) return;
    const px = _imageBitmapData[row][col];
    updatePickedColor(px.r, px.g, px.b);
  });

  // 右键退出吸笔模式
  bitmapCanvas.addEventListener('contextmenu', function(e) {
    if (!_eyedropperActive) return;
    e.preventDefault();
    deactivateEyedropper();
  });

  function deactivateEyedropper() {
    _eyedropperActive = false;
    eyedropperBtn.classList.remove('btn-primary', 'btn-active');
    magnifier.style.display = 'none';
    document.getElementById('originalImage').classList.remove('eyedropper-active');
  }

  bitmapCanvas.addEventListener('mouseleave', function() {
  });

  // ---- 输出区域工具 ----
  let _outputAreaActive = false;
  let _outputArea = null; // { x, y, w, h } in grid cells
  const outputOverlay = document.getElementById('outputOverlay');
  const outputOverlayCtx = outputOverlay.getContext('2d');
  const outputAreaBtn = document.getElementById('outputAreaBtn');
  let _savedOutputArea = null; // 保存上次的线框尺寸
  let _outputDragMode = null; // 'move' | 'resizeTL' | 'resizeBR' | null
  let _dragStartX = 0, _dragStartY = 0;
  let _dragOrigArea = null;

  function outputAreaToPixel(area) {
    const cs = parseInt(cellSizeSlider.value);
    return { x: area.x * cs, y: area.y * cs, w: area.w * cs, h: area.h * cs };
  }

  function drawOutputOverlay() {
    withOverlayScale();
    const ctx = outputOverlayCtx;
    ctx.clearRect(0, 0, outputOverlay.width, outputOverlay.height);
    if (!_outputArea) return;
    const p = outputAreaToPixel(_outputArea);
    const ow = outputOverlay.width, oh = outputOverlay.height;
    const s = _overlayScale;

    // 半透明遮罩（外部变暗）
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, ow, p.y);
    ctx.fillRect(0, p.y + p.h, ow, oh - p.y - p.h);
    ctx.fillRect(0, p.y, p.x, p.h);
    ctx.fillRect(p.x + p.w, p.y, ow - p.x - p.w, p.h);

    // 1px 白色边框
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x, p.y, p.w, p.h);

    // 左上角拖拽手柄 (resizeTL) — 放在线框内左上角，带半透明背景
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x + 2 * s, p.y + 2 * s, 10 * s, 10 * s);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(p.x + 3 * s, p.y + 3 * s, 8 * s, 8 * s);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * s;
    ctx.strokeRect(p.x + 3 * s, p.y + 3 * s, 8 * s, 8 * s);

    // 右下角拖拽手柄 (resizeBR) — 放在线框内右下角，带半透明背景
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x + p.w - 12 * s, p.y + p.h - 12 * s, 10 * s, 10 * s);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(p.x + p.w - 11 * s, p.y + p.h - 11 * s, 8 * s, 8 * s);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * s;
    ctx.strokeRect(p.x + p.w - 11 * s, p.y + p.h - 11 * s, 8 * s, 8 * s);

    // 右上角关闭按钮 (×) — 放在线框内右上角，带半透明背景
    const cx = p.x + p.w - 10 * s, cy = p.y + 10 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.arc(cx, cy, 9 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f85149';
    ctx.beginPath();
    ctx.arc(cx, cy, 7 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1 * s;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(11 * s) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('×', cx, cy + 0.5 * s);

    // 左下角移动手柄 (◉) — 放在线框内左下角，带半透明背景
    const mx = p.x + 10 * s, my = p.y + p.h - 10 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.arc(mx, my, 9 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8b949e';
    ctx.beginPath();
    ctx.arc(mx, my, 7 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * s;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = Math.round(10 * s) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⣿', mx, my + 0.5 * s);

    // 显示尺寸信息 — 放在线框内顶部居中，带半透明背景
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    const labelW = ctx.measureText(_outputArea.w + '×' + _outputArea.h).width + 14 * s;
    const lx = p.x + p.w / 2 - labelW / 2;
    const ly = p.y + 4 * s;
    ctx.fillRect(lx, ly, labelW, 18 * s);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(11 * s) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(_outputArea.w + '×' + _outputArea.h, p.x + p.w / 2, ly + 9 * s);
  }

  function initOutputArea() {
    if (!_imageBitmapData) return;
    const gridH = _imageBitmapData.length;
    const gridW = _imageBitmapData[0].length;
    const pt = parseInt(paddingTop.textContent) || 0;
    const pb = parseInt(paddingBottom.textContent) || 0;
    const pl = parseInt(paddingLeft.textContent) || 0;
    const pr = parseInt(paddingRight.textContent) || 0;
    const totalW = Math.max(1, gridW + pl + pr);
    const totalH = Math.max(1, gridH + pt + pb);
    // 初始框 20×20，居中显示（不超过画布范围）
    const boxSize = 20;
    const bw = Math.min(boxSize, totalW);
    const bh = Math.min(boxSize, totalH);
    const bx = Math.max(0, Math.floor((totalW - bw) / 2));
    const by = Math.max(0, Math.floor((totalH - bh) / 2));
    _outputArea = { x: bx, y: by, w: bw, h: bh };
    syncOverlaySize();
    drawOutputOverlay();
  }

  function syncOverlaySize() {
    const canvasRect = bitmapCanvas.getBoundingClientRect();
    outputOverlay.width = bitmapCanvas.width;
    outputOverlay.height = bitmapCanvas.height;
    outputOverlay.style.width = canvasRect.width + 'px';
    outputOverlay.style.height = canvasRect.height + 'px';
    outputOverlay.style.left = canvasRect.left + 'px';
    outputOverlay.style.top = canvasRect.top + 'px';
  }
  let _overlayScale = 1;
  function withOverlayScale() {
    const cr = bitmapCanvas.getBoundingClientRect();
    _overlayScale = cr.width ? bitmapCanvas.width / cr.width : 1;
  }

  function getCanvasCoord(e) {
    const rect = bitmapCanvas.getBoundingClientRect();
    const scaleX = bitmapCanvas.width / rect.width;
    const scaleY = bitmapCanvas.height / rect.height;
    withOverlayScale();
    return {
      cx: (e.clientX - rect.left) * scaleX,
      cy: (e.clientY - rect.top) * scaleY
    };
  }

  function hitTestOutputArea(cx, cy) {
    if (!_outputArea) return null;
    const p = outputAreaToPixel(_outputArea);
    const s = _overlayScale;

    // 关闭按钮 (右上角，线框内)
    const closeX = p.x + p.w - 10 * s, closeY = p.y + 10 * s;
    if (Math.hypot(cx - closeX, cy - closeY) < 10 * s) return 'close';

    // 右下角拖拽 (线框内)
    if (cx >= p.x + p.w - 12 * s && cx <= p.x + p.w - 2 * s &&
        cy >= p.y + p.h - 12 * s && cy <= p.y + p.h - 2 * s) return 'resizeBR';

    // 左上角拖拽 (线框内)
    if (cx >= p.x + 2 * s && cx <= p.x + 12 * s &&
        cy >= p.y + 2 * s && cy <= p.y + 12 * s) return 'resizeTL';

    // 移动手柄 (左下角，线框内)
    const moveX = p.x + 10 * s, moveY = p.y + p.h - 10 * s;
    if (Math.hypot(cx - moveX, cy - moveY) < 12 * s) return 'move';

    // 在区域内 → 也可以移动
    if (cx >= p.x && cx <= p.x + p.w && cy >= p.y && cy <= p.y + p.h) return 'move';

    return null;
  }

  outputOverlay.addEventListener('pointerdown', function(e) {
    if (!_outputAreaActive || !_outputArea) return;
    const { cx, cy } = getCanvasCoord(e);
    const hit = hitTestOutputArea(cx, cy);
    if (hit === 'close') {
      deactivateOutputArea();
      return;
    }
    if (hit === 'resizeBR' || hit === 'resizeTL') {
      _outputDragMode = hit;
      _dragStartX = cx;
      _dragStartY = cy;
      _dragOrigArea = { ..._outputArea };
      this.setPointerCapture(e.pointerId);
      return;
    }
    if (hit === 'move') {
      _outputDragMode = 'move';
      _dragStartX = cx;
      _dragStartY = cy;
      _dragOrigArea = { ..._outputArea };
      this.setPointerCapture(e.pointerId);
      return;
    }
  });

  outputOverlay.addEventListener('pointermove', function(e) {
    if (!_outputAreaActive || !_outputArea) { this.style.cursor = ''; return; }
    // 悬停时切换光标样式
    if (!_outputDragMode) {
      const { cx, cy } = getCanvasCoord(e);
      const hit = hitTestOutputArea(cx, cy);
      if (hit === 'resizeBR' || hit === 'resizeTL') this.style.cursor = 'nwse-resize';
      else if (hit === 'move') this.style.cursor = 'move';
      else if (hit === 'close') this.style.cursor = 'pointer';
      else this.style.cursor = '';
      return;
    }
    const { cx, cy } = getCanvasCoord(e);
    const cs = parseInt(cellSizeSlider.value);
    const dx = cx - _dragStartX;
    const dy = cy - _dragStartY;

    // 获取点阵总尺寸（约束边界）
    const totalGridW = _imageBitmapData ? _imageBitmapData[0].length + (parseInt(paddingLeft.textContent)||0) + (parseInt(paddingRight.textContent)||0) : 0;
    const totalGridH = _imageBitmapData ? _imageBitmapData.length + (parseInt(paddingTop.textContent)||0) + (parseInt(paddingBottom.textContent)||0) : 0;

    if (_outputDragMode === 'move') {
      let newX = _dragOrigArea.x + Math.round(dx / cs);
      let newY = _dragOrigArea.y + Math.round(dy / cs);
      newX = Math.max(0, Math.min(newX, totalGridW - _dragOrigArea.w));
      newY = Math.max(0, Math.min(newY, totalGridH - _dragOrigArea.h));
      _outputArea.x = newX;
      _outputArea.y = newY;
    } else if (_outputDragMode === 'resizeBR') {
      let newW = _dragOrigArea.w + Math.round(dx / cs);
      let newH = _dragOrigArea.h + Math.round(dy / cs);
      newW = Math.max(1, Math.min(newW, totalGridW - _dragOrigArea.x));
      newH = Math.max(1, Math.min(newH, totalGridH - _dragOrigArea.y));
      _outputArea.w = newW;
      _outputArea.h = newH;
    } else if (_outputDragMode === 'resizeTL') {
      let newX = _dragOrigArea.x + Math.round(dx / cs);
      let newY = _dragOrigArea.y + Math.round(dy / cs);
      let newW = _dragOrigArea.w - Math.round(dx / cs);
      let newH = _dragOrigArea.h - Math.round(dy / cs);
      // 限制左上角不能越过右下角
      newX = Math.min(newX, _dragOrigArea.x + _dragOrigArea.w - 1);
      newY = Math.min(newY, _dragOrigArea.y + _dragOrigArea.h - 1);
      // 限制不能小于 1
      newW = Math.max(1, newW);
      newH = Math.max(1, newH);
      // 限制不能超出左/上边界
      newX = Math.max(0, newX);
      newY = Math.max(0, newY);
      // 限制右下角不能超出画布
      if (newX + newW > totalGridW) newW = totalGridW - newX;
      if (newY + newH > totalGridH) newH = totalGridH - newY;
      _outputArea.x = Math.max(0, newX);
      _outputArea.y = Math.max(0, newY);
      _outputArea.w = Math.max(1, newW);
      _outputArea.h = Math.max(1, newH);
    }

    drawOutputOverlay();
  });

  outputOverlay.addEventListener('pointerup', function(e) {
    if (_outputDragMode) {
      _outputDragMode = null;
      this.releasePointerCapture(e.pointerId);
    }
  });

  outputOverlay.addEventListener('pointerleave', function() {
    if (_outputDragMode) {
      _outputDragMode = null;
    }
  });

  function deactivateOutputArea() {
    _outputAreaActive = false;
    _savedOutputArea = _outputArea; // 保存当前线框尺寸
    _outputArea = null;
    _outputDragMode = null;
    outputOverlay.style.display = 'none';
    outputOverlay.style.pointerEvents = 'none';
    outputAreaBtn.classList.remove('btn-primary', 'btn-active');
  }

  outputAreaBtn.addEventListener('click', function() {
    _outputAreaActive = !_outputAreaActive;
    this.classList.toggle('btn-primary', _outputAreaActive);
    this.classList.toggle('btn-active', _outputAreaActive);

    if (_outputAreaActive) {
      if (!_imageBitmapData) {
        _outputAreaActive = false;
        this.classList.remove('btn-primary', 'btn-active');
        return;
      }
      outputOverlay.style.display = 'block';
      outputOverlay.style.pointerEvents = 'auto';
      // 恢复上次线框尺寸，或初始 20×20 居中
      if (_savedOutputArea) {
        _outputArea = { ..._savedOutputArea };
        syncOverlaySize();
        drawOutputOverlay();
      } else {
        initOutputArea();
      }
      // 互斥：关闭吸笔和画笔
      if (_eyedropperActive) deactivateEyedropper();
      if (_drawBrushActive) {
        _drawBrushActive = false;
        drawBrushBtn.classList.remove('btn-primary', 'btn-active');
      }
    } else {
      deactivateOutputArea();
    }
  });

  // 窗口缩放或滚动时同步 overlay 位置
  function syncOverlayPosition() {
    if (_outputAreaActive && outputOverlay.style.display !== 'none') {
      syncOverlaySize();
      drawOutputOverlay();
    }
  }
  window.addEventListener('resize', syncOverlayPosition);
  window.addEventListener('scroll', syncOverlayPosition, true);

  // 当 bitmap 重绘时同步 overlay
  const _origRenderImageBitmap = renderImageBitmap;
  renderImageBitmap = function(keepEdits) {
    _origRenderImageBitmap(keepEdits);
    if (_outputAreaActive) {
      syncOverlaySize();
      // 如果图片尺寸变了，重置输出区域
      if (_imageBitmapData && _outputArea) {
        const gridH = _imageBitmapData.length;
        const gridW = _imageBitmapData[0].length;
        const pt = parseInt(paddingTop.textContent) || 0;
        const pb = parseInt(paddingBottom.textContent) || 0;
        const pl = parseInt(paddingLeft.textContent) || 0;
        const pr = parseInt(paddingRight.textContent) || 0;
        const totalW = Math.max(1, gridW + pl + pr);
        const totalH = Math.max(1, gridH + pt + pb);
        if (_outputArea.x + _outputArea.w > totalW || _outputArea.y + _outputArea.h > totalH) {
          _outputArea = { x: 0, y: 0, w: totalW, h: totalH };
        }
      }
      drawOutputOverlay();
      // 更新尺寸显示
      const dimEl = document.getElementById('bitmapDims');
      if (dimEl && _outputArea) {
        const cs = parseInt(cellSizeSlider.value);
        const totalW2 = bitmapCanvas.width / cs;
        const totalH2 = bitmapCanvas.height / cs;
        dimEl.textContent = `点阵: 区域 ${_outputArea.w}×${_outputArea.h} / 总计 ${totalW2}×${totalH2}`;
      }
    }
  };

  // ---- 图片宽度控制 ----
  const imageWidthSlider = document.getElementById('imageWidth');
  const imageWidthDisplay = document.getElementById('imageWidthDisplay');
  imageWidthSlider.addEventListener('input', function() {
    const val = parseInt(this.value);
    imageWidthDisplay.textContent = val;
    document.querySelectorAll('.canvas-size-buttons .btn-size[data-w]').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.w) === val);
    });
    if (document.body.classList.contains('mode-image') && _loadedImage) {
      renderImageMode();
    }
  });
  document.querySelectorAll('.image-mode-only .canvas-size-buttons .btn-size').forEach(btn => {
    btn.addEventListener('click', function() {
      const w = parseInt(this.dataset.w);
      imageWidthSlider.value = w;
      imageWidthDisplay.textContent = w;
      document.querySelectorAll('.image-mode-only .canvas-size-buttons .btn-size').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      if (document.body.classList.contains('mode-image') && _loadedImage) {
        renderImageMode();
      }
    });
  });

  // ---- 清空画布 ----
  document.getElementById('clearCanvasBtn').addEventListener('click', function() {
    if (!_drawMatrix) return;
    const h = _drawMatrix.length;
    const w = _drawMatrix[0].length;
    for (let r = 0; r < h; r++)
      for (let c = 0; c < w; c++)
        _drawMatrix[r][c] = 0;
    renderDrawCanvas();
  });

  let _imageUndoStack = [];
  const MAX_UNDO = 50;

  function pushUndoState() {
    if (!document.body.classList.contains('mode-image') || !_imageEdits) return;
    _imageUndoStack.push(JSON.parse(JSON.stringify(_imageEdits)));
    if (_imageUndoStack.length > MAX_UNDO) _imageUndoStack.shift();
    updateToolButtons();
  }

  function updateToolButtons() {
    const clearBtn = document.getElementById('clearImageEditsBtn');
    const undoBtn = document.getElementById('undoImageBtn');
    const eyeBtn = document.getElementById('eyeDropperBtn');
    const drawBtn = document.getElementById('drawBrushBtn');
    const areaBtn = document.getElementById('outputAreaBtn');
    const hasImage = !!_loadedImage;
    if (clearBtn) clearBtn.disabled = !_imageEdits || Object.keys(_imageEdits).length === 0;
    if (undoBtn) undoBtn.disabled = _imageUndoStack.length === 0;
    if (eyeBtn) eyeBtn.disabled = !hasImage;
    if (drawBtn) drawBtn.disabled = !hasImage;
    if (areaBtn) areaBtn.disabled = !hasImage;
  }

  // ---- 清空手动绘制的痕迹 ----
  document.getElementById('clearImageEditsBtn').addEventListener('click', function() {
    if (!_imageOriginalData || !_imageBitmapData) return;
    pushUndoState();
    _imageEdits = {};
    // 从缓存恢复所有原始颜色
    for (let r = 0; r < _imageBitmapData.length && r < _imageOriginalData.length; r++)
      for (let c = 0; c < _imageBitmapData[0].length && c < _imageOriginalData[0].length; c++)
        _imageBitmapData[r][c] = { ..._imageOriginalData[r][c] };
    renderImageBitmap(true);
    updateToolButtons();
  });

  // ---- 倒退 ----
  document.getElementById('undoImageBtn').addEventListener('click', function() {
    if (!_imageOriginalData || !_imageBitmapData || _imageUndoStack.length === 0) return;
    _imageEdits = _imageUndoStack.pop();
    updateToolButtons();
    // 从缓存 + 恢复后的 edits 重建
    for (let r = 0; r < _imageBitmapData.length && r < _imageOriginalData.length; r++) {
      for (let c = 0; c < _imageBitmapData[0].length && c < _imageOriginalData[0].length; c++) {
        const key = r + '_' + c;
        _imageBitmapData[r][c] = _imageEdits[key] ? { ..._imageEdits[key] } : { ..._imageOriginalData[r][c] };
      }
    }
    renderImageBitmap(true);
  });

  // ---- 模式切换 ----
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      // 切换模式时关闭输出区域
      if (_outputAreaActive) deactivateOutputArea();
      const mode = this.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      // 切换 body 的 mode 类（影响全局）
      document.body.classList.remove('mode-draw', 'mode-char', 'mode-image');
      document.body.classList.add('mode-' + mode);
      // 更新偏移标签
      const offsetLabel = document.getElementById('offsetLabel');
      if (offsetLabel) {
        const textNode = Array.from(offsetLabel.childNodes).find(n => n.nodeType === 3 && n.textContent.trim());
        if (textNode) {
          textNode.textContent = mode === 'draw' || mode === 'image' ? t('imageOffset') : t('fontOffset');
        }
      }
      // 模式切换时渲染
      if (mode === 'image') {
        // 强制逐位展开模式
        arrayDimSelect.value = '2d';
        // 阴阳码禁用（RGB565默认不支持）
        const yinYang = document.getElementById('yinYangSelect');
        yinYang.disabled = true;
        yinYang.style.opacity = '0.4';
        yinYang.style.pointerEvents = 'none';
        // 重置图片宽度
        imageWidthSlider.value = 64;
        imageWidthDisplay.textContent = 64;
        document.querySelectorAll('.image-mode-only .canvas-size-buttons .btn-size').forEach(b => b.classList.toggle('active', parseInt(b.dataset.w) === 64));
        // 重置点阵单元大小为4
        cellSizeSlider.value = 4;
        cellSizeDisplay.textContent = 4;
        document.querySelectorAll('.btn-shortcut[data-cell]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.cell) === 4));
        // 重置边距偏移
        paddingTop.textContent = 0;
        paddingBottom.textContent = 0;
        paddingLeft.textContent = 0;
        paddingRight.textContent = 0;
        offsetX.value = 0;
        offsetY.value = 0;
        updateOffsetDisplay();
        window._bitmapIsDraw = false;
        _imageEdits = {};
        _imageBitmapData = null;
        _imageUndoStack = [];
        renderImageMode();
      } else if (mode === 'draw') {
        // 恢复阴阳码可用
        const yinYang = document.getElementById('yinYangSelect');
        yinYang.disabled = false;
        yinYang.style.opacity = '1';
        yinYang.style.pointerEvents = 'auto';
        // 重置点阵单元大小为8
        cellSizeSlider.value = 8;
        cellSizeDisplay.textContent = 8;
        document.querySelectorAll('.btn-shortcut[data-cell]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.cell) === 8));
        // 重置画布尺寸为16×16
        canvasWidthInput.value = 16;
        canvasHeightInput.value = 16;
        document.querySelectorAll('.btn-size').forEach(b => b.classList.toggle('active', parseInt(b.dataset.w) === 16 && parseInt(b.dataset.h) === 16));
        // 重置边距为0
        paddingTop.textContent = 0;
        paddingBottom.textContent = 0;
        paddingLeft.textContent = 0;
        paddingRight.textContent = 0;
        // 重置偏移为0
        offsetX.value = 0;
        offsetY.value = 0;
        updateOffsetDisplay();
        window._bitmapIsDraw = true;
        renderDrawCanvas();
      } else {
        // 恢复阴阳码可用
        const yinYang = document.getElementById('yinYangSelect');
        yinYang.disabled = false;
        yinYang.style.opacity = '1';
        yinYang.style.pointerEvents = 'auto';
        // 重置字体大小为16
        fontSizeSlider.value = 16;
        fontSizeDisplay.textContent = 16;
        document.querySelectorAll('.btn-shortcut[data-size]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.size) === 16));
        // 重置点阵单元大小为4
        cellSizeSlider.value = 4;
        cellSizeDisplay.textContent = 4;
        document.querySelectorAll('.btn-shortcut[data-cell]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.cell) === 4));
        // 重置边距为0
        paddingTop.textContent = 0;
        paddingBottom.textContent = 0;
        paddingLeft.textContent = 0;
        paddingRight.textContent = 0;
        // 重置偏移为0
        offsetX.value = 0;
        offsetY.value = 0;
        updateOffsetDisplay();
        window._bitmapIsDraw = false;
        fullRender();
      }
    });
  });

  // ---- 画布尺寸快速选择按钮 ----
  const canvasWidthInput = document.getElementById('canvasWidth');
  const canvasHeightInput = document.getElementById('canvasHeight');
  document.querySelectorAll('.btn-size').forEach(btn => {
    btn.addEventListener('click', function() {
      const w = parseInt(this.dataset.w);
      const h = parseInt(this.dataset.h);
      canvasWidthInput.value = w;
      canvasHeightInput.value = h;
      document.querySelectorAll('.btn-size').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const isDraw = document.querySelector('.mode-btn[data-mode="draw"].active');
      if (isDraw && typeof renderDrawCanvas === 'function') {
        renderDrawCanvas();
      } else if (typeof scheduleRender === 'function') {
        scheduleRender();
      }
    });
  });

  // ---- 画布尺寸手动输入 ----
  canvasWidthInput.addEventListener('input', function() {
    const val = parseInt(this.value) || 16;
    document.querySelectorAll('.btn-size').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.w) === val && parseInt(b.dataset.h) === parseInt(canvasHeightInput.value));
    });
    const isDraw = document.querySelector('.mode-btn[data-mode="draw"].active');
    if (isDraw && typeof renderDrawCanvas === 'function') {
      renderDrawCanvas();
    } else if (typeof scheduleRender === 'function') {
      scheduleRender();
    }
  });
  canvasHeightInput.addEventListener('input', function() {
    const val = parseInt(this.value) || 16;
    document.querySelectorAll('.btn-size').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.h) === val && parseInt(b.dataset.w) === parseInt(canvasWidthInput.value));
    });
    const isDraw = document.querySelector('.mode-btn[data-mode="draw"].active');
    if (isDraw && typeof renderDrawCanvas === 'function') {
      renderDrawCanvas();
    } else if (typeof scheduleRender === 'function') {
      scheduleRender();
    }
  });

  // ---- 窗口 resize 不重绘, 但加个稳妥启动 ----
  console.log('Font Bitmap Tool started');
})();
</script>

</body>
</html>
